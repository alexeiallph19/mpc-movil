plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mpcmovil'
    compileSdk 34

    defaultConfig {
        applicationId "com.mpmplayer.android"
        minSdk 21
        targetSdk 34
        versionCode 10
        versionName "4.4.1-MPM"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("MPM_KEYSTORE_PATH"))
            storePassword System.getenv("MPM_KEYSTORE_PASSWORD")
            keyAlias System.getenv("MPM_KEY_ALIAS")
            keyPassword System.getenv("MPM_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation project(':application:vlc-android')
}
