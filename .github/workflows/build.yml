name: Compilar MPM Player Android

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: ["desarrollo/interfaz-mpc"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Configurar propiedades de VLC
        run: |
          printf 'android.ndkFullVersion=21.4.7075529\\n' > local.properties

      - name: Preparar firma permanente
        env:
          MPM_KEYSTORE_BASE64: ${{ secrets.MPM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MPM_KEYSTORE_BASE64" ]; then
            echo "::error::El secreto MPM_KEYSTORE_BASE64 está vacío o no está disponible."
            exit 1
          fi
          printf '%s' "$MPM_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/mpm-player-release.jks"
          DECODED_SIZE=$(wc -c < "$RUNNER_TEMP/mpm-player-release.jks" | tr -d ' ')
          if [ "$DECODED_SIZE" -ne 2766 ]; then
            echo "::error::El keystore reconstruido no tiene el tamaño esperado."
            exit 1
          fi

      - name: Validar firma permanente
        env:
          MPM_KEYSTORE_PASSWORD: ${{ secrets.MPM_KEYSTORE_PASSWORD }}
          MPM_KEY_ALIAS: ${{ secrets.MPM_KEY_ALIAS }}
        run: |
          if [ -z "$MPM_KEYSTORE_PASSWORD" ] || [ -z "$MPM_KEY_ALIAS" ]; then
            echo "::error::Faltan secretos de firma."
            exit 1
          fi
          keytool -list -keystore "$RUNNER_TEMP/mpm-player-release.jks" -storepass "$MPM_KEYSTORE_PASSWORD" -alias "$MPM_KEY_ALIAS"

      - name: Compilar MPM Player
        env:
          MPM_KEYSTORE_PATH: ${{ runner.temp }}/mpm-player-release.jks
          MPM_KEYSTORE_PASSWORD: ${{ secrets.MPM_KEYSTORE_PASSWORD }}
          MPM_KEY_ALIAS: ${{ secrets.MPM_KEY_ALIAS }}
          MPM_KEY_PASSWORD: ${{ secrets.MPM_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Subir APK generado
        uses: actions/upload-artifact@v7
        with:
          name: MPM Player-Android-v4.4.1
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
