name: Compilar MPM Player Android

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar APK en GitHub Releases"
        required: false
        type: boolean
        default: false
  push:
    branches: ["desarrollo/interfaz-mpc"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'

      - name: Preparar firma permanente
        env:
          MPM_KEYSTORE_BASE64: ${{ secrets.MPM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MPM_KEYSTORE_BASE64" ]; then
            echo "::error::El secreto MPM_KEYSTORE_BASE64 está vacío o no está disponible."
            exit 1
          fi
          ENCODED_LENGTH=$(printf '%s' "$MPM_KEYSTORE_BASE64" | tr -d '\r\n ' | wc -c)
          echo "Longitud Base64 recibida: $ENCODED_LENGTH caracteres."
          if ! printf '%s' "$MPM_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/mpm-player-release.jks"; then
            echo "::error::No se pudo decodificar MPM_KEYSTORE_BASE64."
            exit 1
          fi
          DECODED_SIZE=$(wc -c < "$RUNNER_TEMP/mpm-player-release.jks" | tr -d ' ')
          echo "Tamaño del keystore reconstruido: $DECODED_SIZE bytes."
          if [ "$DECODED_SIZE" -ne 2766 ]; then
            echo "::error::El keystore recibido no tiene el tamaño esperado de 2766 bytes."
            exit 1
          fi

      - name: Validar firma permanente
        env:
          MPM_KEYSTORE_PASSWORD: ${{ secrets.MPM_KEYSTORE_PASSWORD }}
          MPM_KEY_ALIAS: ${{ secrets.MPM_KEY_ALIAS }}
        run: |
          if [ -z "$MPM_KEYSTORE_PASSWORD" ]; then
            echo "::error::Falta el secreto MPM_KEYSTORE_PASSWORD."
            exit 1
          fi
          if [ -z "$MPM_KEY_ALIAS" ]; then
            echo "::error::Falta el secreto MPM_KEY_ALIAS."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/mpm-player-release.jks" -storepass "$MPM_KEYSTORE_PASSWORD" -alias "$MPM_KEY_ALIAS" > "$RUNNER_TEMP/keystore-check.log" 2>&1; then
            echo "::error::No se pudo validar la firma. Detalle de keytool:"
            cat "$RUNNER_TEMP/keystore-check.log"
            exit 1
          fi
          echo "Keystore y alias válidos."

      - name: Generar proyecto MPM Player
        env:
          MPM_KEYSTORE_PATH: ${{ runner.temp }}/mpm-player-release.jks
          MPM_KEYSTORE_PASSWORD: ${{ secrets.MPM_KEYSTORE_PASSWORD }}
          MPM_KEY_ALIAS: ${{ secrets.MPM_KEY_ALIAS }}
          MPM_KEY_PASSWORD: ${{ secrets.MPM_KEY_PASSWORD }}
        run: |
          mkdir -p app/src/main/java/com/mpcmovil
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MPMPlayer"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.mpcmovil'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mpmplayer.android"
                  minSdk 21
                  targetSdk 34
                  versionCode 10
                  versionName "4.4.1-MPM"
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv("MPM_KEYSTORE_PATH"))
                      storePassword System.getenv("MPM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("MPM_KEY_ALIAS")
                      keyPassword System.getenv("MPM_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

