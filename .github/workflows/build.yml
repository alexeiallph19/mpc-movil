name: Compilar MPM Player Android

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: ["desarrollo/interfaz-mpc"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Preparar firma permanente
        env:
          MPM_KEYSTORE_BASE64: ${{ secrets.MPM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MPM_KEYSTORE_BASE64" ]; then
            echo "::error::El secreto MPM_KEYSTORE_BASE64 está vacío o no está disponible."
            exit 1
          fi
          ENCODED_LENGTH=$(printf '%s' "$MPM_KEYSTORE_BASE64" | tr -d '\r\n ' | wc -c)
          echo "Longitud Base64 recibida: $ENCODED_LENGTH caracteres."
          if ! printf '%s' "$MPM_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/mpm-player-release.jks"; then
            echo "::error::No se pudo decodificar MPM_KEYSTORE_BASE64."
            exit 1
          fi
          DECODED_SIZE=$(wc -c < "$RUNNER_TEMP/mpm-player-release.jks" | tr -d ' ')
          echo "Tamaño del keystore reconstruido: $DECODED_SIZE bytes."
          if [ "$DECODED_SIZE" -ne 2766 ]; then
            echo "::error::El keystore recibido no tiene el tamaño esperado de 2766 bytes."
            exit 1
          fi

      - name: Validar firma permanente
        env:
          MPM_KEYSTORE_PASSWORD: ${{ secrets.MPM_KEYSTORE_PASSWORD }}
          MPM_KEY_ALIAS: ${{ secrets.MPM_KEY_ALIAS }}
        run: |
          if [ -z "$MPM_KEYSTORE_PASSWORD" ]; then
            echo "::error::Falta el secreto MPM_KEYSTORE_PASSWORD."
            exit 1
          fi
          if [ -z "$MPM_KEY_ALIAS" ]; then
            echo "::error::Falta el secreto MPM_KEY_ALIAS."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/mpm-player-release.jks" -storepass "$MPM_KEYSTORE_PASSWORD" -alias "$MPM_KEY_ALIAS" > "$RUNNER_TEMP/keystore-check.log" 2>&1; then
            echo "::error::No se pudo validar la firma. Detalle de keytool:"
            cat "$RUNNER_TEMP/keystore-check.log"
            exit 1
          fi
          echo "Keystore y alias válidos."

      - name: Generar proyecto MPM Player
        env:
          MPM_KEYSTORE_PATH: ${{ runner.temp }}/mpm-player-release.jks
          MPM_KEYSTORE_PASSWORD: ${{ secrets.MPM_KEYSTORE_PASSWORD }}
          MPM_KEY_ALIAS: ${{ secrets.MPM_KEY_ALIAS }}
          MPM_KEY_PASSWORD: ${{ secrets.MPM_KEY_PASSWORD }}
        run: |
          mkdir -p app/src/main/java/com/mpcmovil
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MPMPlayer"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.mpcmovil'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mpmplayer.android"
                  minSdk 21
                  targetSdk 34
                  versionCode 7
                  versionName "4.2.0-MPM"
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv("MPM_KEYSTORE_PATH"))
                      storePassword System.getenv("MPM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("MPM_KEY_ALIAS")
                      keyPassword System.getenv("MPM_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.activity:activity-ktx:1.8.2'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.videolan.android:libvlc-all:3.6.0-eap13'
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_mpm_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#181818" android:pathData="M14,14h80a8,8 0,0 1,8 8v64a8,8 0,0 1,-8 8h-80a8,8 0,0 1,-8 -8v-64a8,8 0,0 1,8 -8z" />
              <path android:fillColor="#2A2A2A" android:pathData="M14,14h80v20h-80z" />
              <path android:fillColor="#E0E0E0" android:pathData="M20,16l10,16h-7l-10,-16z M40,16l10,16h-7l-10,-16z M60,16l10,16h-7l-10,-16z M80,16l10,16h-7l-10,-16z" />
              <path android:fillColor="#2196F3" android:pathData="M44,46l28,17l-28,17z" />
              <path android:strokeColor="#555555" android:strokeWidth="1.5" android:pathData="M14,34h80" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">MPM Player</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.MPMPlayer" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#121212</item>
                  <item name="android:statusBarColor">#00000000</item>
                  <item name="android:navigationBarColor">#00000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_mpm_logo"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.MPMPlayer">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|uiMode|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#090B0E">
              <org.videolan.libvlc.util.VLCVideoLayout
                  android:id="@+id/videoLayout" android:layout_width="match_parent" android:layout_height="match_parent" />
              <LinearLayout
                  android:id="@+id/welcomeScreen" android:layout_width="match_parent" android:layout_height="match_parent"
                  android:gravity="center" android:orientation="vertical" android:background="#F20B0E12" android:padding="28dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="MPM"
                      android:textColor="#F2F5F8" android:textSize="34sp" android:textStyle="bold" android:letterSpacing="0.12" />
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="5dp"
                      android:text="MEDIA PLAYER" android:textColor="#8995A3" android:textSize="10sp" android:letterSpacing="0.22" />
                  <View android:layout_width="34dp" android:layout_height="2dp" android:layout_marginTop="22dp" android:background="#4DA3FF" />
                  <Button android:id="@+id/btnWelcomeOpen" style="@style/Widget.AppCompat.Button.Borderless"
                      android:layout_width="wrap_content" android:layout_height="44dp" android:layout_marginTop="22dp"
                      android:paddingStart="22dp" android:paddingEnd="22dp" android:text="Abrir archivo"
                      android:textAllCaps="false" android:textColor="#DCEBFA" android:textSize="14sp" android:backgroundTint="#263C5A" />
              </LinearLayout>
              <LinearLayout
                  android:id="@+id/topBar" android:layout_width="match_parent" android:layout_height="42dp"
                  android:layout_gravity="top" android:background="#D910141A" android:gravity="center_vertical"
                  android:orientation="horizontal" android:paddingStart="5dp" android:paddingEnd="5dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:paddingStart="9dp"
                      android:paddingEnd="10dp" android:text="MPM" android:textColor="#69B2FF" android:textSize="13sp"
                      android:textStyle="bold" android:letterSpacing="0.06" />
                  <View android:layout_width="1dp" android:layout_height="19dp" android:background="#39434F" />
                  <HorizontalScrollView android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1"
                      android:scrollbars="none">
                      <LinearLayout android:layout_width="wrap_content" android:layout_height="match_parent"
                          android:gravity="center_vertical" android:orientation="horizontal">
                          <Button android:id="@+id/topMenuFile" style="@style/Widget.AppCompat.Button.Borderless" android:layout_width="wrap_content" android:layout_height="36dp" android:minWidth="0dp" android:minHeight="0dp" android:paddingStart="9dp" android:paddingEnd="9dp" android:text="Archivo" android:textAllCaps="false" android:textColor="#D5DCE5" android:textSize="12sp" />
                          <Button android:id="@+id/topMenuView" style="@style/Widget.AppCompat.Button.Borderless" android:layout_width="wrap_content" android:layout_height="36dp" android:minWidth="0dp" android:minHeight="0dp" android:paddingStart="9dp" android:paddingEnd="9dp" android:text="Ver" android:textAllCaps="false" android:textColor="#D5DCE5" android:textSize="12sp" />
                          <Button android:id="@+id/topMenuPlay" style="@style/Widget.AppCompat.Button.Borderless" android:layout_width="wrap_content" android:layout_height="36dp" android:minWidth="0dp" android:minHeight="0dp" android:paddingStart="9dp" android:paddingEnd="9dp" android:text="Reproducir" android:textAllCaps="false" android:textColor="#D5DCE5" android:textSize="12sp" />
                          <Button android:id="@+id/topMenuNavigate" style="@style/Widget.AppCompat.Button.Borderless" android:layout_width="wrap_content" android:layout_height="36dp" android:minWidth="0dp" android:minHeight="0dp" android:paddingStart="9dp" android:paddingEnd="9dp" android:text="Navegar" android:textAllCaps="false" android:textColor="#D5DCE5" android:textSize="12sp" />
                          <Button android:id="@+id/topMenuFavorites" style="@style/Widget.AppCompat.Button.Borderless" android:layout_width="wrap_content" android:layout_height="36dp" android:minWidth="0dp" android:minHeight="0dp" android:paddingStart="9dp" android:paddingEnd="9dp" android:text="Favoritos" android:textAllCaps="false" android:textColor="#D5DCE5" android:textSize="12sp" />
                          <Button android:id="@+id/topMenuHelp" style="@style/Widget.AppCompat.Button.Borderless" android:layout_width="wrap_content" android:layout_height="36dp" android:minWidth="0dp" android:minHeight="0dp" android:paddingStart="9dp" android:paddingEnd="9dp" android:text="Ayuda" android:textAllCaps="false" android:textColor="#D5DCE5" android:textSize="12sp" />
                      </LinearLayout>
                  </HorizontalScrollView>
              </LinearLayout>
              <TextView android:id="@+id/txtOsd" android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_gravity="center" android:background="#E51A2029" android:paddingStart="18dp" android:paddingEnd="18dp"
                  android:paddingTop="11dp" android:paddingBottom="11dp" android:textColor="#F4F7FA" android:textSize="14sp"
                  android:visibility="gone" />
              <LinearLayout
                  android:id="@+id/bottomBar" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_gravity="bottom" android:background="#EC10151C" android:orientation="vertical"
                  android:paddingStart="12dp" android:paddingEnd="12dp" android:paddingTop="7dp" android:paddingBottom="5dp">
                  <SeekBar android:id="@+id/seekBar" android:layout_width="match_parent" android:layout_height="22dp"
                      android:max="1000" android:paddingStart="0dp" android:paddingEnd="0dp"
                      android:progressTint="#55A8FF" android:progressBackgroundTint="#46515E" android:thumbTint="#EAF4FF" />
                  <TextView android:id="@+id/txtTime" android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:gravity="center" android:paddingTop="1dp" android:paddingBottom="3dp"
                      android:text="00:00:00 / 00:00:00" android:textColor="#B9C4D0" android:textSize="11sp" android:fontFamily="monospace" />
                  <LinearLayout android:layout_width="match_parent" android:layout_height="42dp"
                      android:gravity="center" android:orientation="horizontal">
                      <Button android:id="@+id/btnBack" style="@style/Widget.AppCompat.Button.Borderless" android:layout_width="42dp" android:layout_height="40dp" android:minWidth="0dp" android:minHeight="0dp" android:padding="0dp" android:text="−10" android:textAllCaps="false" android:textColor="#C9D2DC" android:textSize="11sp" />
                      <Button android:id="@+id/btnPlay" style="@style/Widget.AppCompat.Button.Borderless" android:layout_width="48dp" android:layout_height="40dp" android:minWidth="0dp" android:minHeight="0dp" android:padding="0dp" android:text="▶" android:textAllCaps="false" android:textColor="#72B7FF" android:textSize="19sp" />
                      <Button android:id="@+id/btnPause" style="@style/Widget.AppCompat.Button.Borderless" android:layout_width="40dp" android:layout_height="40dp" android:minWidth="0dp" android:minHeight="0dp" android:padding="0dp" android:text="Ⅱ" android:textAllCaps="false" android:textColor="#DCE4EC" android:textSize="16sp" />
                      <Button android:id="@+id/btnStop" style="@style/Widget.AppCompat.Button.Borderless" android:layout_width="40dp" android:layout_height="40dp" android:minWidth="0dp" android:minHeight="0dp" android:padding="0dp" android:text="■" android:textAllCaps="false" android:textColor="#DCE4EC" android:textSize="14sp" />
                      <Button android:id="@+id/btnForward" style="@style/Widget.AppCompat.Button.Borderless" android:layout_width="42dp" android:layout_height="40dp" android:minWidth="0dp" android:minHeight="0dp" android:padding="0dp" android:text="+10" android:textAllCaps="false" android:textColor="#C9D2DC" android:textSize="11sp" />
                      <View android:layout_width="1dp" android:layout_height="20dp" android:layout_marginStart="5dp" android:layout_marginEnd="5dp" android:background="#3B4652" />
                      <Button android:id="@+id/btnSpeed" style="@style/Widget.AppCompat.Button.Borderless" android:layout_width="48dp" android:layout_height="40dp" android:minWidth="0dp" android:minHeight="0dp" android:padding="0dp" android:text="1.0X" android:textAllCaps="false" android:textColor="#C9D2DC" android:textSize="11sp" />
                      <Button android:id="@+id/btnHwSw" style="@style/Widget.AppCompat.Button.Borderless" android:layout_width="42dp" android:layout_height="40dp" android:minWidth="0dp" android:minHeight="0dp" android:padding="0dp" android:text="HW" android:textAllCaps="false" android:textColor="#78D6A1" android:textSize="11sp" />
                      <Button android:id="@+id/btnRotateBottom" style="@style/Widget.AppCompat.Button.Borderless" android:layout_width="40dp" android:layout_height="40dp" android:minWidth="0dp" android:minHeight="0dp" android:padding="0dp" android:text="↻" android:textAllCaps="false" android:textColor="#C9D2DC" android:textSize="17sp" />
                  </LinearLayout>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="18dp"
                      android:gravity="center_vertical" android:orientation="horizontal">
                      <TextView android:id="@+id/txtStatus" android:layout_width="0dp" android:layout_height="wrap_content"
                          android:layout_weight="1" android:text="Listo" android:textColor="#8492A2" android:textSize="10sp" />
                      <TextView android:id="@+id/txtDecoderInfo" android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="[HW]" android:textColor="#78D6A1" android:textSize="10sp" />
                  </LinearLayout>
              </LinearLayout>
          </FrameLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/mpcmovil/MainActivity.kt
          package com.mpcmovil

          import android.app.AlertDialog
          import android.content.Intent
          import android.content.res.AssetFileDescriptor
          import android.media.MediaMetadataRetriever
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.os.Build
          import android.database.Cursor
          import android.provider.OpenableColumns
          import android.util.Log
          import android.content.pm.ActivityInfo
          import android.content.res.Configuration
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.*
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import org.videolan.libvlc.*
          import org.videolan.libvlc.util.VLCVideoLayout
          import java.util.Locale
          import java.io.File
          import java.io.FileOutputStream
          import java.util.concurrent.Executors

          class MainActivity : AppCompatActivity() {

              private lateinit var videoLayout: VLCVideoLayout
              private lateinit var welcomeScreen: View
              private lateinit var topBar: View
              private lateinit var bottomBar: View
              private lateinit var txtStatus: TextView
              private lateinit var txtDecoderInfo: TextView
              private lateinit var txtTime: TextView
              private lateinit var txtOsd: TextView
              private lateinit var seekBar: SeekBar
              private lateinit var btnPlay: Button
              private lateinit var btnHwSw: Button
              private lateinit var btnSpeed: Button

              private var libVLC: LibVLC? = null
              private var mediaPlayer: MediaPlayer? = null
              private var currentUri: Uri? = null
              private var currentAssetDescriptor: AssetFileDescriptor? = null
              private var viewsAttached = false
              private var playbackDiagnostics = ""
              private var playbackEvents = mutableListOf<String>()
              private var isHw = true
              private var isControlsVisible = true
              private var immersiveMode = false
              private var subtitlePickerPending = false
              private var resumeAfterSubtitlePicker = false
              private var filePickerPending = false
              private var resumeAfterFilePicker = false
              private var displayUnderNotch = true
              private var aspectIndex = 0
              private var rotationMode = 0
              private val speeds = floatArrayOf(0.5f, 0.75f, 1.0f, 1.25f, 1.5f, 2.0f)
              private var speedIndex = 2
              private val aspects = arrayOf("Original / automático", "16:9", "4:3", "1:1", "2.35:1", "Rellenar")
              private val aspectValues = arrayOf<String?>(null, "16:9", "4:3", "1:1", "2.35:1", "fill")

              private val handler = Handler(Looper.getMainLooper())
              private val thumbnailExecutor = Executors.newSingleThreadExecutor()
              private var lastProgressSaveAt = 0L
              private var isSeeking = false
              private lateinit var gestureDetector: GestureDetector

              private val fileLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { res ->
                  val uri = if (res.resultCode == RESULT_OK) res.data?.data else null
                  val shouldResume = resumeAfterFilePicker
                  filePickerPending = false
                  resumeAfterFilePicker = false
                  videoLayout.postDelayed({
                      restoreVideoOutput(uri == null && shouldResume)
                      if (uri != null) {
                          persistReadPermission(uri, res.data?.flags ?: 0)
                          play(uri)
                      }
                  }, 300)
              }

              private val subtitleLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { res ->
                  val uri = if (res.resultCode == RESULT_OK) res.data?.data else null
                  finishSubtitlePicker()
                  if (uri != null) {
                      persistReadPermission(uri, res.data?.flags ?: 0)
                      attachExternalSubtitle(uri)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  setContentView(R.layout.activity_main)
                  displayUnderNotch = getSharedPreferences("mpm_player", MODE_PRIVATE)
                      .getBoolean("display_under_notch", true)
                  applyDisplayUnderNotch()
                  enterImmersiveMode()
                  applyPreferredRefreshRate()
                  initViews()
                  initGestures()
                  initPlayer()
                  intent?.data?.let { play(it) }
              }

              private fun showTopMenu(anchor: View, section: String) {
                  val popup = PopupMenu(this, anchor)
                  when (section) {
                      "Archivo" -> {
                          popup.menu.add("Abrir video").setOnMenuItemClickListener { pickFile(); true }
                          popup.menu.add("Abrir audio").setOnMenuItemClickListener { pickAudio(); true }
                          popup.menu.add("Abrir subtítulo").setOnMenuItemClickListener { pickExternalSubtitle(); true }
                      }
                      "Ver" -> {
                          popup.menu.add("Relación de aspecto").setOnMenuItemClickListener { showAspectMenu(); true }
                          popup.menu.add("Cambiar orientación").setOnMenuItemClickListener { cycleRotation(); true }
                          popup.menu.add("Mostrar video bajo notch").apply {
                              isCheckable = true
                              isChecked = displayUnderNotch
                              setOnMenuItemClickListener {
                                  displayUnderNotch = !displayUnderNotch
                                  getSharedPreferences("mpm_player", MODE_PRIVATE).edit()
                                      .putBoolean("display_under_notch", displayUnderNotch).apply()
                                  applyDisplayUnderNotch()
                                  showOsd(if (displayUnderNotch) "Video bajo el notch activado" else "Video bajo el notch desactivado")
                                  true
                              }
                          }
                          popup.menu.add("Pantalla completa").setOnMenuItemClickListener { enterImmersiveMode(); true }
                      }
                      "Reproducir" -> {
                          popup.menu.add("Reproducir / Pausar").setOnMenuItemClickListener {
                              mediaPlayer?.let { player -> if (player.isPlaying) player.pause() else player.play() }
                              true
                          }
                          popup.menu.add("Detener").setOnMenuItemClickListener {
                              savePlaybackProgress()
                              mediaPlayer?.stop()
                              releaseCurrentAssetDescriptor()
                              welcomeScreen.visibility = View.VISIBLE
                              txtStatus.text = "Detenido"
                              true
                          }
                          popup.menu.add("Velocidad").setOnMenuItemClickListener {
                              speedIndex = (speedIndex + 1) % speeds.size
                              val speed = speeds[speedIndex]
                              mediaPlayer?.rate = speed
                              btnSpeed.text = "${speed}X"
                              showOsd("Velocidad: ${speed}X")
                              true
                          }
                      }
                      "Navegar" -> {
                          popup.menu.add("Retroceder 10 segundos").setOnMenuItemClickListener {
                              mediaPlayer?.let { player -> player.time = (player.time - 10000L).coerceAtLeast(0L) }
                              true
                          }
                          popup.menu.add("Avanzar 10 segundos").setOnMenuItemClickListener {
                              mediaPlayer?.let { player -> player.time = (player.time + 10000L).coerceAtMost(player.length) }
                              true
                          }
                          popup.menu.add("Pistas de audio").setOnMenuItemClickListener { pickAudio(); true }
                          popup.menu.add("Pistas de subtítulos").setOnMenuItemClickListener { pickSubtitles(); true }
                      }
                      "Favoritos" -> {
                          popup.menu.add("Guardar video actual").setOnMenuItemClickListener { saveFavorite(); true }
                          popup.menu.add("Abrir favoritos").setOnMenuItemClickListener { showFavorites(); true }
                      }
                      "Ayuda" -> {
                          popup.menu.add("Acerca de MPM Player").setOnMenuItemClickListener {
                              AlertDialog.Builder(this).setTitle("MPM Player")
                                  .setMessage("Reproductor multimedia para Android.\n\nUsa Archivo para abrir videos y subtítulos, Ver para ajustar la pantalla, y Reproducir o Navegar para controlar la reproducción.")
                                  .setPositiveButton("Aceptar", null).show()
                              true
                          }
                      }
                  }
                  popup.show()
              }

              private fun initViews() {
                  videoLayout = findViewById(R.id.videoLayout)
                  welcomeScreen = findViewById(R.id.welcomeScreen)
                  topBar = findViewById(R.id.topBar)
                  bottomBar = findViewById(R.id.bottomBar)
                  txtStatus = findViewById(R.id.txtStatus)
                  txtDecoderInfo = findViewById(R.id.txtDecoderInfo)
                  txtTime = findViewById(R.id.txtTime)
                  txtOsd = findViewById(R.id.txtOsd)
                  seekBar = findViewById(R.id.seekBar)
                  btnPlay = findViewById(R.id.btnPlay)
                  btnHwSw = findViewById(R.id.btnHwSw)
                  btnSpeed = findViewById(R.id.btnSpeed)

                  findViewById<Button>(R.id.topMenuFile).setOnClickListener { showTopMenu(it, "Archivo") }
                  findViewById<Button>(R.id.topMenuView).setOnClickListener { showTopMenu(it, "Ver") }
                  findViewById<Button>(R.id.topMenuPlay).setOnClickListener { showTopMenu(it, "Reproducir") }
                  findViewById<Button>(R.id.topMenuNavigate).setOnClickListener { showTopMenu(it, "Navegar") }
                  findViewById<Button>(R.id.topMenuFavorites).setOnClickListener { showTopMenu(it, "Favoritos") }
                  findViewById<Button>(R.id.topMenuHelp).setOnClickListener { showTopMenu(it, "Ayuda") }

                  findViewById<Button>(R.id.btnWelcomeOpen).setOnClickListener { pickFile() }
                  findViewById<Button>(R.id.btnRotateBottom).setOnClickListener { cycleRotation() }

                  btnPlay.setOnClickListener {
                      mediaPlayer?.let { p -> if (p.isPlaying) p.pause() else p.play() }
                  }
                  findViewById<Button>(R.id.btnPause).setOnClickListener { mediaPlayer?.pause() }

                  findViewById<Button>(R.id.btnStop).setOnClickListener {
                      mediaPlayer?.stop()
                      releaseCurrentAssetDescriptor()
                      welcomeScreen.visibility = View.VISIBLE
                      txtStatus.text = "Detenido"
                      txtTime.text = "00:00:00 / 00:00:00"
                      seekBar.progress = 0
                  }

                  findViewById<Button>(R.id.btnBack).setOnClickListener {
                      mediaPlayer?.let { p ->
                          p.time = (p.time - 10000L).coerceAtLeast(0L)
                          showOsd("-10s (${formatTime(p.time)})")
                      }
                  }

                  findViewById<Button>(R.id.btnForward).setOnClickListener {
                      mediaPlayer?.let { p ->
                          p.time = (p.time + 10000L).coerceAtMost(p.length)
                          showOsd("+10s (${formatTime(p.time)})")
                      }
                  }

                  btnSpeed.setOnClickListener {
                      speedIndex = (speedIndex + 1) % speeds.size
                      val spd = speeds[speedIndex]
                      mediaPlayer?.rate = spd
                      btnSpeed.text = "${spd}X"
                      showOsd("Velocidad: ${spd}X")
                  }

                  btnHwSw.setOnClickListener {
                      isHw = !isHw
                      updateDecoderUi()
                      showOsd(if (isHw) "Decodificador Hardware (HW)" else "Decodificador Software (SW)")
                      currentUri?.let { u ->
                          val pos = mediaPlayer?.time ?: 0L
                          rebuildPlayer()
                          play(u, pos)
                      }
                  }

                  seekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (fromUser && mediaPlayer != null) {
                              val len = mediaPlayer!!.length
                              if (len > 0) {
                                  val t = (len * (progress / 1000f)).toLong()
                                  txtTime.text = "${formatTime(t)} / ${formatTime(len)}"
                              }
                          }
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) { isSeeking = true }
                      override fun onStopTrackingTouch(sb: SeekBar?) {
                          isSeeking = false
                          mediaPlayer?.let { p ->
                              if (p.length > 0) p.time = (p.length * (seekBar.progress / 1000f)).toLong()
                          }
                      }
                  })
              }

              private fun initPlayer() {
                  val opts = ArrayList<String>()
                  opts.add("--file-caching=2000")
                  opts.add("--network-caching=2000")
                  opts.add("--avcodec-threads=4")
                  opts.add("--avcodec-fast")
                  // Dejar que VLC seleccione el decodificador de hardware compatible.
                  // En modo software se desactiva explícitamente la aceleración.
                  if (!isHw) {
                      opts.add("--avcodec-hw=none")
                  }

                  libVLC = LibVLC(this, opts)
                  mediaPlayer = MediaPlayer(libVLC)

                  mediaPlayer?.setEventListener { ev ->
                      val eventName = when (ev.type) {
                          MediaPlayer.Event.Opening -> "Opening"
                          MediaPlayer.Event.Buffering -> "Buffering"
                          MediaPlayer.Event.Playing -> "Playing"
                          MediaPlayer.Event.Paused -> "Paused"
                          MediaPlayer.Event.Stopped -> "Stopped"
                          MediaPlayer.Event.EndReached -> "EndReached"
                          MediaPlayer.Event.EncounteredError -> "EncounteredError"
                          else -> "Event-${ev.type}"
                      }
                      playbackEvents.add(eventName)
                      if (playbackEvents.size > 20) playbackEvents.removeAt(0)
                      Log.d("MPM_PLAYER", "VLC event: $eventName")
                      when (ev.type) {
                          MediaPlayer.Event.Playing -> {
                              welcomeScreen.visibility = View.GONE
                              txtStatus.text = "Reproduciendo"
                              btnPlay.text = "❚❚"
                          }
                          MediaPlayer.Event.Paused -> {
                              txtStatus.text = "Pausa"
                              btnPlay.text = "▶"
                          }
                          MediaPlayer.Event.Stopped -> {
                              welcomeScreen.visibility = View.VISIBLE
                              txtStatus.text = "Detenido"
                              btnPlay.text = "▶"
                          }
                          MediaPlayer.Event.TimeChanged -> {
                              val t = ev.timeChanged
                              val l = mediaPlayer?.length ?: 0L
                              if (l > 0) {
                                  if (!isSeeking) {
                                      seekBar.progress = ((t.toFloat() / l) * 1000).toInt()
                                      txtTime.text = "${formatTime(t)} / ${formatTime(l)}"
                                  }
                                  if (t - lastProgressSaveAt >= 5000L) {
                                      lastProgressSaveAt = t
                                      savePlaybackProgress()
                                  }
                              }
                          }
                          MediaPlayer.Event.EndReached -> {
                              currentUri?.let { clearPlaybackProgress(it) }
                          }
                          MediaPlayer.Event.EncounteredError -> {
                              txtStatus.text = "Error al abrir"
                              val report = playbackDiagnostics + "\n\nEventos VLC: " + playbackEvents.joinToString(" → ")
                              Log.e("MPM_PLAYER", report)
                              AlertDialog.Builder(this)
                                  .setTitle("Diagnóstico de reproducción")
                                  .setMessage(report)
                                  .setPositiveButton("Cerrar", null)
                                  .show()
                          }
                      }
                  }
                  updateDecoderUi()
              }

              private fun rebuildPlayer() {
                  mediaPlayer?.stop()
                  releaseCurrentAssetDescriptor()
                  if (viewsAttached) {
                      mediaPlayer?.detachViews()
                      viewsAttached = false
                  }
                  mediaPlayer?.release()
                  libVLC?.release()
                  initPlayer()
              }

              private fun play(uri: Uri, startPos: Long = -1L) {
                  if (startPos < 0L) {
                      val saved = getPlaybackProgress(uri)
                      if (saved > 10_000L) {
                          val name = getDisplayName(uri)
                          AlertDialog.Builder(this)
                              .setTitle("Continuar reproducción")
                              .setMessage("¿Quieres continuar ${name} desde ${formatTime(saved)} o empezar desde el principio?")
                              .setPositiveButton("Continuar") { _, _ -> play(uri, saved) }
                              .setNegativeButton("Empezar de cero") { _, _ ->
                                  clearPlaybackProgress(uri)
                                  play(uri, 0L)
                              }
                              .setNeutralButton("Cancelar", null)
                              .show()
                          return
                      }
                      play(uri, 0L)
                      return
                  }
                  if (!viewsAttached) {
                      videoLayout.post {
                          if (isFinishing || isDestroyed) return@post
                          if (!viewsAttached) {
                              mediaPlayer?.attachViews(videoLayout, null, false, false)
                              viewsAttached = true
                          }
                          play(uri, startPos)
                      }
                      return
                  }
                  mediaPlayer?.stop()
                  releaseCurrentAssetDescriptor()
                  currentUri = uri
                  lastProgressSaveAt = 0L
                  playbackEvents.clear()
                  try {
                      var displayName = "desconocido"
                      var fileSize = "desconocido"
                      var mimeType = contentResolver.getType(uri) ?: "desconocido"
                      var cursor: Cursor? = null
                      try {
                          cursor = contentResolver.query(uri, null, null, null, null)
                          cursor?.use { c ->
                              if (c.moveToFirst()) {
                                  val nameIndex = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                                  val sizeIndex = c.getColumnIndex(OpenableColumns.SIZE)
                                  if (nameIndex >= 0) displayName = c.getString(nameIndex) ?: displayName
                                  if (sizeIndex >= 0) fileSize = c.getString(sizeIndex) ?: fileSize
                              }
                          }
                      } catch (queryError: Exception) {
                          Log.e("MPM_PLAYER", "No se pudo consultar el archivo", queryError)
                      }
                      playbackDiagnostics = "Archivo: $displayName\nTamaño: $fileSize bytes\nTipo: $mimeType\nURI: $uri\nEsquema: ${uri.scheme}\nHW/SW: ${if (isHw) "HW" else "SW"}"
                      Log.d("MPM_PLAYER", playbackDiagnostics)
                      // Abrir el URI SAF como AssetFileDescriptor y entregarle el descriptor
                      // directamente a LibVLC, evitando que VLC intente resolver content:// por su cuenta.
                      val afd = contentResolver.openAssetFileDescriptor(uri, "r")
                          ?: throw IllegalStateException("Android no pudo abrir el descriptor del archivo")
                      currentAssetDescriptor = afd
                      val m = Media(libVLC, afd)
                      m.addOption(":file-caching=2000")
                      mediaPlayer?.media = m
                      m.release()
                      mediaPlayer?.play()
                      if (startPos > 0) {
                          handler.postDelayed({ mediaPlayer?.time = startPos }, 500)
                      }
                      welcomeScreen.visibility = View.GONE
                  } catch (e: Exception) {
                      releaseCurrentAssetDescriptor()
                      txtStatus.text = "No se pudo abrir el archivo"
                      playbackDiagnostics = "Excepción: ${e.javaClass.name}\nMensaje: ${e.message}\nURI: $uri"
                      Log.e("MPM_PLAYER", playbackDiagnostics, e)
                      AlertDialog.Builder(this).setTitle("Error al abrir archivo").setMessage(playbackDiagnostics).setPositiveButton("Cerrar", null).show()
                  }
              }

              private fun progressKey(uri: Uri): String = "progress_" + uri.toString().hashCode().toString()

              private fun getPlaybackProgress(uri: Uri): Long =
                  getSharedPreferences("mpm_player", MODE_PRIVATE).getLong(progressKey(uri), 0L)

              private fun savePlaybackProgress() {
                  val uri = currentUri ?: return
                  val player = mediaPlayer ?: return
                  val position = player.time
                  val duration = player.length
                  if (position > 0L && duration > 0L && position < duration - 10_000L) {
                      getSharedPreferences("mpm_player", MODE_PRIVATE).edit()
                          .putLong(progressKey(uri), position).apply()
                  }
              }

              private fun clearPlaybackProgress(uri: Uri) {
                  getSharedPreferences("mpm_player", MODE_PRIVATE).edit()
                      .remove(progressKey(uri)).apply()
              }

              private fun releaseCurrentAssetDescriptor() {
                  try {
                      currentAssetDescriptor?.close()
                  } catch (e: Exception) {
                      Log.w("MPM_PLAYER", "No se pudo cerrar el descriptor anterior", e)
                  } finally {
                      currentAssetDescriptor = null
                  }
              }

              private fun pickFile() {
                  filePickerPending = true
                  resumeAfterFilePicker = mediaPlayer?.isPlaying == true
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                      type = "video/*"
                  }
                  try {
                      fileLauncher.launch(intent)
                  } catch (e: Exception) {
                      filePickerPending = false
                      resumeAfterFilePicker = false
                      Toast.makeText(this, "No se pudo abrir el selector de archivos", Toast.LENGTH_LONG).show()
                  }
              }

              private fun persistReadPermission(uri: Uri, flags: Int) {
                  val granted = flags and Intent.FLAG_GRANT_READ_URI_PERMISSION
                  if (granted != 0) {
                      try {
                          contentResolver.takePersistableUriPermission(uri, granted)
                      } catch (e: Exception) {
                          Log.w("MPM_PLAYER", "El proveedor no permite conservar el permiso del archivo", e)
                      }
                  }
              }

              private fun getDisplayName(uri: Uri): String {
                  var name = uri.lastPathSegment ?: "Video"
                  try {
                      contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use { c ->
                          if (c.moveToFirst()) {
                              val index = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                              if (index >= 0) name = c.getString(index) ?: name
                          }
                      }
                  } catch (_: Exception) { }
                  return name
              }

              private fun saveFavorite() {
                  val uri = currentUri
                  if (uri == null) {
                      Toast.makeText(this, "Primero abre un video", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val favorites = getSharedPreferences("mpm_player", MODE_PRIVATE)
                      .getStringSet("favorites", emptySet())?.toMutableSet() ?: mutableSetOf()
                  favorites.add(uri.toString())
                  getSharedPreferences("mpm_player", MODE_PRIVATE).edit()
                      .putStringSet("favorites", favorites).apply()
                  showOsd("Añadido a favoritos")
              }

              private fun showFavorites() {
                  val favorites = getSharedPreferences("mpm_player", MODE_PRIVATE)
                      .getStringSet("favorites", emptySet())?.toList().orEmpty()
                  if (favorites.isEmpty()) {
                      AlertDialog.Builder(this).setTitle("Favoritos")
                          .setMessage("Todavía no has guardado videos")
                          .setPositiveButton("Aceptar", null).show()
                      return
                  }
                  var selected = 0
                  val adapter = object : BaseAdapter() {
                      override fun getCount(): Int = favorites.size
                      override fun getItem(position: Int): Any = favorites[position]
                      override fun getItemId(position: Int): Long = position.toLong()
                      override fun getView(position: Int, convertView: View?, parent: android.view.ViewGroup?): View {
                          val row = convertView as? LinearLayout ?: LinearLayout(this@MainActivity).apply {
                              orientation = LinearLayout.HORIZONTAL
                              gravity = android.view.Gravity.CENTER_VERTICAL
                              setPadding(dp(8), dp(6), dp(8), dp(6))
                              val image = ImageView(this@MainActivity).apply {
                                  tag = "favorite_thumbnail"
                                  layoutParams = LinearLayout.LayoutParams(dp(76), dp(58))
                                  scaleType = ImageView.ScaleType.CENTER_CROP
                                  setBackgroundColor(0xFF252525.toInt())
                              }
                              val label = TextView(this@MainActivity).apply {
                                  tag = "favorite_label"
                                  setTextColor(0xFFFFFFFF.toInt())
                                  textSize = 14f
                                  maxLines = 2
                                  setPadding(dp(12), 0, 0, 0)
                              }
                              addView(image)
                              addView(label, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                          }
                          val image = row.findViewWithTag<ImageView>("favorite_thumbnail")
                          val label = row.findViewWithTag<TextView>("favorite_label")
                          val uri = Uri.parse(favorites[position])
                          label.text = getDisplayName(uri)
                          image.setImageDrawable(null)
                          image.setImageResource(android.R.drawable.ic_menu_report_image)
                          val expectedTag = "favorite_thumbnail:" + uri.toString()
                          image.tag = expectedTag
                          val cacheFile = File(cacheDir, "favorite_" + uri.toString().hashCode() + ".jpg")
                          if (cacheFile.exists() && cacheFile.length() > 0L) {
                              BitmapFactory.decodeFile(cacheFile.absolutePath)?.let { image.setImageBitmap(it) }
                          } else {
                              val target = image
                              thumbnailExecutor.execute {
                                  var bitmap: Bitmap? = null
                                  try {
                                      val retriever = MediaMetadataRetriever()
                                      try {
                                          retriever.setDataSource(this@MainActivity, uri)
                                          bitmap = retriever.getFrameAtTime(1_000_000, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                                              ?: retriever.getFrameAtTime(-1, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                                      } finally {
                                          retriever.release()
                                      }
                                      bitmap?.let { frame ->
                                          FileOutputStream(cacheFile).use { out ->
                                              frame.compress(Bitmap.CompressFormat.JPEG, 82, out)
                                          }
                                      }
                                  } catch (e: Exception) {
                                      Log.w("MPM_PLAYER", "No se pudo generar miniatura del favorito", e)
                                  }
                                  runOnUiThread {
                                      if (target.tag == expectedTag && bitmap != null) {
                                          target.setImageBitmap(bitmap)
                                      }
                                  }
                              }
                          }
                          return row
                      }
                  }
                  AlertDialog.Builder(this).setTitle("Videos favoritos")
                      .setSingleChoiceItems(adapter, 0) { _, which -> selected = which }
                      .setPositiveButton("Abrir") { _, _ -> play(Uri.parse(favorites[selected])) }
                      .setNeutralButton("Quitar") { _, _ ->
                          val updated = favorites.toMutableSet()
                          updated.remove(favorites[selected])
                          getSharedPreferences("mpm_player", MODE_PRIVATE).edit()
                              .putStringSet("favorites", updated).apply()
                          showOsd("Favorito eliminado")
                      }
                      .setNegativeButton("Cerrar", null).show()
              }

              private fun pickExternalSubtitle() {
                  if (currentUri == null) {
                      Toast.makeText(this, "Primero abre un video", Toast.LENGTH_SHORT).show()
                      return
                  }
                  subtitlePickerPending = true
                  resumeAfterSubtitlePicker = false
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                      type = "*/*"
                  }
                  try {
                      subtitleLauncher.launch(intent)
                  } catch (e: Exception) {
                      subtitlePickerPending = false
                      Toast.makeText(this, "No se pudo abrir el selector de subtítulos", Toast.LENGTH_LONG).show()
                  }
              }

              private fun finishSubtitlePicker() {
                  subtitlePickerPending = false
                  val shouldResume = resumeAfterSubtitlePicker
                  resumeAfterSubtitlePicker = false
                  videoLayout.postDelayed({ restoreVideoOutput(shouldResume) }, 250)
              }

              private fun restoreVideoOutput(shouldResume: Boolean) {
                  val player = mediaPlayer ?: return
                  if (currentUri == null) return
                  try {
                      if (viewsAttached) player.detachViews()
                      viewsAttached = false
                      player.attachViews(videoLayout, null, false, false)
                      viewsAttached = true
                      if (shouldResume) player.play()
                  } catch (e: Exception) {
                      Log.w("MPM_PLAYER", "No se pudo restaurar la salida de video", e)
                  }
              }

              private fun attachExternalSubtitle(uri: Uri) {
                  Thread {
                      try {
                          val displayName = getDisplayName(uri)
                          val extension = displayName.substringAfterLast('.', "srt")
                              .lowercase(Locale.ROOT).filter { it.isLetterOrDigit() }.take(8).ifBlank { "srt" }
                          val subtitleFile = java.io.File(cacheDir, "mpm_subtitle_${System.currentTimeMillis()}.$extension")
                          contentResolver.openInputStream(uri)?.use { input ->
                              subtitleFile.outputStream().use { output -> input.copyTo(output) }
                          } ?: throw IllegalStateException("No se pudo leer el subtítulo")
                          runOnUiThread {
                              val added = mediaPlayer?.addSlave(0, Uri.fromFile(subtitleFile), true) ?: false // 0 = libvlc_media_slave_type_subtitle
                              if (added) showOsd("Subtítulo cargado: $displayName")
                              else Toast.makeText(this, "VLC no pudo cargar este subtítulo", Toast.LENGTH_LONG).show()
                          }
                      } catch (e: Exception) {
                          Log.e("MPM_PLAYER", "Error al cargar subtítulo externo", e)
                          runOnUiThread {
                              AlertDialog.Builder(this).setTitle("Error de subtítulos")
                                  .setMessage(e.message ?: "No se pudo cargar el archivo")
                                  .setPositiveButton("Aceptar", null).show()
                          }
                      }
                  }.start()
              }

              private fun cycleRotation() {
                  rotationMode = (rotationMode + 1) % 3
                  when (rotationMode) {
                      0 -> {
                          requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR
                          showOsd("Pantalla: Sensor Automático")
                      }
                      1 -> {
                          requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                          showOsd("Pantalla: Horizontal (Landscape)")
                      }
                      2 -> {
                          requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                          showOsd("Pantalla: Vertical (Portrait)")
                      }
                  }
                  enterImmersiveMode()
                  videoLayout.post { videoLayout.requestLayout() }
              }

              private fun applyDisplayUnderNotch() {
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  window.statusBarColor = android.graphics.Color.TRANSPARENT
                  window.navigationBarColor = android.graphics.Color.TRANSPARENT
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      window.attributes = window.attributes.apply {
                          layoutInDisplayCutoutMode = if (displayUnderNotch) {
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                          } else {
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_NEVER
                          }
                      }
                  }
                  window.decorView.requestLayout()
                  enterImmersiveMode()
              }

              private fun enterImmersiveMode() {
                  immersiveMode = true
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).let { controller ->
                      controller.hide(WindowInsetsCompat.Type.systemBars())
                      controller.systemBarsBehavior =
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }

              private fun applyPreferredRefreshRate() {
                  // No fijar la pantalla a su Hz máximo: LibVLC conserva la cadencia
                  // original del video y Android puede gestionar el refresco disponible.
                  // Un refresco de 90/120 Hz no convierte un video de 24 FPS en 90/120 FPS.
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      try {
                          window.attributes = window.attributes.apply {
                              preferredRefreshRate = 0f
                              preferredDisplayModeId = 0
                          }
                      } catch (e: Exception) {
                          Log.w("MPM_PLAYER", "No se pudo dejar la frecuencia de pantalla en modo automático", e)
                      }
                  }
              }

              private fun displayRefreshRateLabel(): String {
                  return try {
                      // Mostrar el refresco actual, no el máximo que admite el dispositivo.
                      windowManager.defaultDisplay.refreshRate.toInt().toString() + " Hz"
                  } catch (_: Exception) {
                      "Hz automático"
                  }
              }

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus && immersiveMode) {
                      window.decorView.post { enterImmersiveMode() }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  if (immersiveMode) {
                      window.decorView.post { enterImmersiveMode() }
                  }
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  videoLayout.post {
                      videoLayout.requestLayout()
                      if (immersiveMode) enterImmersiveMode()
                  }
              }

              private fun applyAspect(index: Int) {
                  aspectIndex = index.coerceIn(aspects.indices)
                  mediaPlayer?.aspectRatio = aspectValues[aspectIndex]
                  showOsd("Aspecto: ${aspects[aspectIndex]}")
              }

              private fun cycleAspect() {
                  applyAspect((aspectIndex + 1) % aspects.size)
              }

              private fun showAspectMenu() {
                  AlertDialog.Builder(this)
                      .setTitle("Relación de aspecto")
                      .setSingleChoiceItems(aspects, aspectIndex) { dialog, which ->
                          applyAspect(which)
                          dialog.dismiss()
                      }
                      .setNegativeButton("Cerrar", null)
                      .show()
              }

              private fun pickAudio() {
                  val tracks = mediaPlayer?.audioTracks ?: return
                  if (tracks.isEmpty()) return
                  val names = tracks.map { it.name }.toTypedArray()
                  val cur = mediaPlayer?.audioTrack ?: -1
                  val sel = tracks.indexOfFirst { it.id == cur }.coerceAtLeast(0)

                  AlertDialog.Builder(this)
                      .setTitle("Audio (MPM Player)")
                      .setSingleChoiceItems(names, sel) { d, i ->
                          mediaPlayer?.audioTrack = tracks[i].id
                          showOsd("Audio: ${tracks[i].name}")
                          d.dismiss()
                      }
                      .setNegativeButton("Cerrar", null).show()
              }

              private fun pickSubtitles() {
                  val tracks = mediaPlayer?.spuTracks ?: return
                  if (tracks.isEmpty()) return
                  val names = tracks.map { it.name }.toTypedArray()
                  val cur = mediaPlayer?.spuTrack ?: -1
                  val sel = tracks.indexOfFirst { it.id == cur }.coerceAtLeast(0)

                  AlertDialog.Builder(this)
                      .setTitle("Subtítulos (MPM Player)")
                      .setSingleChoiceItems(names, sel) { d, i ->
                          mediaPlayer?.spuTrack = tracks[i].id
                          showOsd("Subtítulos: ${tracks[i].name}")
                          d.dismiss()
                      }
                      .setNegativeButton("Cerrar", null).show()
              }

              private fun initGestures() {
                  gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onDown(e: MotionEvent): Boolean = true
                      override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                          isControlsVisible = !isControlsVisible
                          val v = if (isControlsVisible) View.VISIBLE else View.GONE
                          topBar.visibility = v
                          bottomBar.visibility = v
                          return true
                      }
                      override fun onDoubleTap(e: MotionEvent): Boolean {
                          mediaPlayer?.let { p -> if (p.isPlaying) p.pause() else p.play() }
                          return true
                      }
                      override fun onLongPress(e: MotionEvent) {
                          showAspectMenu()
                      }
                  })

                  videoLayout.setOnTouchListener { _, ev ->
                      gestureDetector.onTouchEvent(ev)
                      true
                  }
              }

              private fun showOsd(msg: String) {
                  txtOsd.text = msg
                  txtOsd.visibility = View.VISIBLE
                  handler.removeCallbacks(osdRunnable)
                  handler.postDelayed(osdRunnable, 1600)
              }

              private val osdRunnable = Runnable { txtOsd.visibility = View.GONE }

              private fun updateDecoderUi() {
                  val refresh = displayRefreshRateLabel()
                  if (isHw) {
                      btnHwSw.text = "HW"
                      btnHwSw.setTextColor(0xFF2ECC71.toInt())
                      txtDecoderInfo.text = "[HW | " + refresh + "]"
                  } else {
                      btnHwSw.text = "SW"
                      btnHwSw.setTextColor(0xFFE67E22.toInt())
                      txtDecoderInfo.text = "[SW | " + refresh + "]"
                  }
              }

              private fun formatTime(ms: Long): String {
                  val s = (ms / 1000) % 60
                  val m = (ms / 60000) % 60
                  val h = ms / 3600000
                  return String.format(Locale.US, "%02d:%02d:%02d", h, m, s)
              }

              override fun onPause() {
                  super.onPause()
                  savePlaybackProgress()
                  if (subtitlePickerPending) {
                      resumeAfterSubtitlePicker = mediaPlayer?.isPlaying == true || resumeAfterSubtitlePicker
                  }
                  if (filePickerPending) {
                      resumeAfterFilePicker = mediaPlayer?.isPlaying == true || resumeAfterFilePicker
                  }
                  mediaPlayer?.pause()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  mediaPlayer?.stop()
                  mediaPlayer?.release()
                  releaseCurrentAssetDescriptor()
                  libVLC?.release()
              }
          }
          EOF

          gradle assembleRelease --no-daemon --stacktrace

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: MPM Player-Android-v4.2.0
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publicar APK en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mpc-android-build-${{ github.run_number }}
          name: MPM Player Android - compilación #${{ github.run_number }}
          body: |
            MPM Player 4.2.0

            Novedades:
            - Favoritos guardados en el dispositivo.
            - Apertura de subtítulos externos compatibles con VLC.
            - Conservación de permisos de archivos para volver a abrirlos.
            - Se mantiene el motor LibVLC y la firma permanente.

            Rama: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          prerelease: true
          files: app/build/outputs/apk/release/app-release.apk
