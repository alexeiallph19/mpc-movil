name: Compilar MPM Player Android

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: ["desarrollo/interfaz-mpc"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Preparar fuentes VLC para compilación release
        run: |
          # VLC keeps local native development dependencies in the dev variant.
          # This MPM workflow builds release and uses the published LibVLC/MediaLibrary artifacts.
          sed -i "/^[[:space:]]*devApi project(':libvlcjni:libvlc')/d" third_party/vlc-android/application/resources/build.gradle
          sed -i "/^[[:space:]]*devApi project(':medialibrary')/d" third_party/vlc-android/application/resources/build.gradle
          sed -i "/^[[:space:]]*devApi project(':libvlcjni:libvlc')/d" third_party/vlc-android/application/vlc-android/build.gradle
          sed -i "/^[[:space:]]*devApi project(':medialibrary')/d" third_party/vlc-android/application/vlc-android/build.gradle
          # The upstream VLC library references these colors from its own R class.
          # In the standalone VLC app they are supplied by the app module; MPM embeds
          # the library without that app module, so provide the two shared resources here.
          mkdir -p third_party/vlc-android/application/vlc-android/res/values
          cat > third_party/vlc-android/application/vlc-android/res/values/mpm_vlc_compat_colors.xml <<'EOF'
          <resources>
              <color name="black_transparent_10">#1a000000</color>
              <color name="white_transparent_10">#1affffff</color>
          </resources>
          EOF

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Configurar propiedades de VLC
        run: |
          printf 'android.ndkFullVersion=21.4.7075529\\n' > local.properties

      - name: Preparar firma permanente
        env:
          MPM_KEYSTORE_BASE64: ${{ secrets.MPM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MPM_KEYSTORE_BASE64" ]; then
            echo "::error::El secreto MPM_KEYSTORE_BASE64 está vacío o no está disponible."
            exit 1
          fi
          printf '%s' "$MPM_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/mpm-player-release.jks"
          DECODED_SIZE=$(wc -c < "$RUNNER_TEMP/mpm-player-release.jks" | tr -d ' ')
          if [ "$DECODED_SIZE" -ne 2766 ]; then
            echo "::error::El keystore reconstruido no tiene el tamaño esperado."
            exit 1
          fi

      - name: Validar firma permanente
        env:
          MPM_KEYSTORE_PASSWORD: ${{ secrets.MPM_KEYSTORE_PASSWORD }}
          MPM_KEY_ALIAS: ${{ secrets.MPM_KEY_ALIAS }}
        run: |
          if [ -z "$MPM_KEYSTORE_PASSWORD" ] || [ -z "$MPM_KEY_ALIAS" ]; then
            echo "::error::Faltan secretos de firma."
            exit 1
          fi
          keytool -list -keystore "$RUNNER_TEMP/mpm-player-release.jks" -storepass "$MPM_KEYSTORE_PASSWORD" -alias "$MPM_KEY_ALIAS"

      - name: Compilar MPM Player
        env:
          MPM_KEYSTORE_PATH: ${{ runner.temp }}/mpm-player-release.jks
          MPM_KEYSTORE_PASSWORD: ${{ secrets.MPM_KEYSTORE_PASSWORD }}
          MPM_KEY_ALIAS: ${{ secrets.MPM_KEY_ALIAS }}
          MPM_KEY_PASSWORD: ${{ secrets.MPM_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Subir APK generado
        uses: actions/upload-artifact@v7
        with:
          name: MPM Player-Android-v4.4.1
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
