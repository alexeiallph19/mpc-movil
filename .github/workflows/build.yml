name: Compilar APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Crear proyecto
        run: |
          mkdir -p app/src/main/java/com/mpcmovil app/src/main/res/layout app/src/main/res/values
          echo "android.useAndroidX=true" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g" >> gradle.properties

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MpcMovil"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.mpcmovil"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.mpcmovil"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("org.videolan.android:libvlc-all:3.6.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="MPC Movil"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:screenOrientation="fullSensor"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Tb">
                  <item name="android:layout_width">46dp</item>
                  <item name="android:layout_height">42dp</item>
                  <item name="android:gravity">center</item>
                  <item name="android:textColor">#E6E8EB</item>
                  <item name="android:textSize">20sp</item>
                  <item name="android:clickable">true</item>
                  <item name="android:focusable">true</item>
                  <item name="android:background">?android:attr/selectableItemBackground</item>
              </style>
              <style name="Tx" parent="Tb">
                  <item name="android:layout_width">wrap_content</item>
                  <item name="android:minWidth">64dp</item>
                  <item name="android:textSize">13sp</item>
                  <item name="android:paddingStart">10dp</item>
                  <item name="android:paddingEnd">10dp</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/root"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="#000000" android:keepScreenOn="true">

              <org.videolan.libvlc.util.VLCVideoLayout
                  android:id="@+id/video"
                  android:layout_width="match_parent" android:layout_height="match_parent"/>

              <TextView android:id="@+id/title"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_gravity="top" android:background="#D915171B"
                  android:textColor="#DCDCDC" android:textSize="13sp"
                  android:singleLine="true" android:ellipsize="end"
                  android:padding="10dp" android:text="MPC Movil"/>

              <LinearLayout android:id="@+id/panel"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_gravity="bottom" android:orientation="vertical"
                  android:background="#E61B1D21" android:padding="6dp">

                  <SeekBar android:id="@+id/seek"
                      android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:max="1000" android:progressTint="#3B9CFF"
                      android:thumbTint="#E6E8EB" android:progressBackgroundTint="#555B66"/>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:orientation="horizontal" android:gravity="center_vertical">
                      <TextView android:id="@+id/play" style="@style/Tb" android:text="▶"/>
                      <TextView android:id="@+id/stop" style="@style/Tb" android:text="■"/>
                      <TextView android:id="@+id/back" style="@style/Tb" android:text="«"/>
                      <TextView android:id="@+id/fwd" style="@style/Tb" android:text="»"/>
                      <TextView android:id="@+id/frame" style="@style/Tb" android:text=">|"/>
                      <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="Vol" android:textColor="#8B929C" android:textSize="12sp"/>
                      <SeekBar android:id="@+id/vol"
                          android:layout_width="110dp" android:layout_height="wrap_content"
                          android:max="100" android:progress="100"
                          android:progressTint="#3B9CFF" android:thumbTint="#E6E8EB"
                          android:progressBackgroundTint="#555B66"/>
                  </LinearLayout>

                  <HorizontalScrollView android:layout_width="match_parent"
                      android:layout_height="wrap_content" android:scrollbars="none">
                      <LinearLayout android:layout_width="wrap_content"
                          android:layout_height="wrap_content" android:orientation="horizontal">
                          <TextView android:id="@+id/open" style="@style/Tx" android:text="Abrir"/>
                          <TextView android:id="@+id/subs" style="@style/Tx" android:text="Subs"/>
                          <TextView android:id="@+id/audio" style="@style/Tx" android:text="Audio"/>
                          <TextView android:id="@+id/speed" style="@style/Tx" android:text="1.0x"/>
                          <TextView android:id="@+id/fit" style="@style/Tx" android:text="Ajustar"/>
                          <TextView android:id="@+id/hw" style="@style/Tx" android:text="HW"/>
                      </LinearLayout>
                  </HorizontalScrollView>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:orientation="horizontal" android:paddingTop="4dp"
                      android:paddingStart="6dp" android:paddingEnd="6dp">
                      <TextView android:id="@+id/status"
                          android:layout_width="0dp" android:layout_height="wrap_content"
                          android:layout_weight="1" android:text="Listo"
                          android:textColor="#8B929C" android:textSize="12sp"/>
                      <TextView android:id="@+id/time"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="00:00 / 00:00" android:textColor="#DCDCDC"
                          android:textSize="12sp" android:fontFamily="monospace"/>
                  </LinearLayout>
              </LinearLayout>
          </FrameLayout>
          EOF

          cat > app/src/main/java/com/mpcmovil/MainActivity.kt <<'EOF'
          package com.mpcmovil

          import android.content.res.Configuration
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.ParcelFileDescriptor
          import android.provider.OpenableColumns
          import android.view.View
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import org.videolan.libvlc.LibVLC
          import org.videolan.libvlc.Media
          import org.videolan.libvlc.MediaPlayer
          import org.videolan.libvlc.util.VLCVideoLayout
          import java.io.File

          class MainActivity : AppCompatActivity() {
              private lateinit var libVLC: LibVLC
              private lateinit var player: MediaPlayer
              private lateinit var panel: View
              private lateinit var titleBar: TextView
              private lateinit var statusView: TextView
              private lateinit var timeView: TextView
              private lateinit var playBtn: TextView
              private lateinit var hwBtn: TextView
              private var pfd: ParcelFileDescriptor? = null
              private var currentUri: Uri? = null
              private var hw = true
              private var voutCount = 0
              private val handler = Handler(Looper.getMainLooper())
              private val speeds = floatArrayOf(0.5f, 0.75f, 1f, 1.25f, 1.5f, 2f)
              private var speedIdx = 2
              private var seeking = false
              private var subDelayMs = 0L
              private var fitIdx = 0
              private val fitTypes = arrayOf(
                  MediaPlayer.ScaleType.SURFACE_BEST_FIT, MediaPlayer.ScaleType.SURFACE_FILL,
                  MediaPlayer.ScaleType.SURFACE_16_9, MediaPlayer.ScaleType.SURFACE_4_3,
                  MediaPlayer.ScaleType.SURFACE_ORIGINAL
              )
              private val fitNames = arrayOf("Ajustar", "Llenar", "16:9", "4:3", "Original")
              private val PLAY = "\u25B6\uFE0E"
              private val PAUSE = "\u275A\u275A"

              private val pickVideo = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null) {
                      subDelayMs = 0L
                      titleBar.text = nameOf(uri)
                      startPlayback(uri, 0L)
                  }
              }
              private val pickSubs = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null) addSubtitle(uri)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  panel = findViewById(R.id.panel)
                  titleBar = findViewById(R.id.title)
                  statusView = findViewById(R.id.status)
                  timeView = findViewById(R.id.time)
                  playBtn = findViewById(R.id.play)
                  hwBtn = findViewById(R.id.hw)
                  val video = findViewById<VLCVideoLayout>(R.id.video)
                  val seek = findViewById<SeekBar>(R.id.seek)
                  val vol = findViewById<SeekBar>(R.id.vol)
                  playBtn.text = PLAY

                  libVLC = LibVLC(this, arrayListOf("--no-drop-late-frames", "--no-skip-frames"))
                  player = MediaPlayer(libVLC)
                  player.attachViews(video, null, true, false)

                  player.setEventListener(MediaPlayer.EventListener { e ->
                      when (e.type) {
                          MediaPlayer.Event.TimeChanged -> runOnUiThread {
                              val len = player.length
                              if (!seeking && len > 0) seek.progress = (player.time * 1000 / len).toInt()
                              timeView.text = fmt(player.time) + " / " + fmt(len)
                          }
                          MediaPlayer.Event.Vout -> runOnUiThread { voutCount = e.voutCount }
                          MediaPlayer.Event.Playing -> runOnUiThread {
                              playBtn.text = PAUSE
                              statusView.text = "Reproduciendo"
                          }
                          MediaPlayer.Event.Paused -> runOnUiThread {
                              playBtn.text = PLAY
                              statusView.text = "En pausa"
                          }
                          MediaPlayer.Event.Stopped -> runOnUiThread {
                              playBtn.text = PLAY
                              statusView.text = "Detenido"
                              seek.progress = 0
                              timeView.text = "00:00 / 00:00"
                          }
                          MediaPlayer.Event.EncounteredError -> runOnUiThread {
                              statusView.text = "Error al reproducir"
                              Toast.makeText(this, "Error al reproducir este archivo", Toast.LENGTH_LONG).show()
                          }
                      }
                  })

                  seek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          val len = player.length
                          if (fromUser && len > 0) player.setTime(p * len / 1000)
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) { seeking = true }
                      override fun onStopTrackingTouch(s: SeekBar?) { seeking = false }
                  })
                  vol.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          if (fromUser) player.setVolume(p)
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })

                  findViewById<View>(R.id.root).setOnClickListener { toggleUi() }
                  findViewById<View>(R.id.open).setOnClickListener { pickVideo.launch(arrayOf("*/*")) }
                  playBtn.setOnClickListener {
                      if (player.isPlaying) player.pause() else player.play()
                  }
                  findViewById<View>(R.id.stop).setOnClickListener { player.stop() }
                  findViewById<View>(R.id.back).setOnClickListener {
                      player.setTime(maxOf(0L, player.time - 10000L))
                  }
                  findViewById<View>(R.id.fwd).setOnClickListener { player.setTime(player.time + 10000L) }
                  findViewById<View>(R.id.frame).setOnClickListener {
                      player.pause()
                      player.setTime(player.time + 42L)
                  }
                  findViewById<TextView>(R.id.speed).setOnClickListener { b ->
                      speedIdx = (speedIdx + 1) % speeds.size
                      player.setRate(speeds[speedIdx])
                      (b as TextView).text = speeds[speedIdx].toString() + "x"
                  }
                  findViewById<TextView>(R.id.fit).setOnClickListener { b ->
                      fitIdx = (fitIdx + 1) % fitTypes.size
                      player.setVideoScale(fitTypes[fitIdx])
                      (b as TextView).text = fitNames[fitIdx]
                  }
                  hwBtn.setOnClickListener {
                      hw = !hw
                      hwBtn.text = if (hw) "HW" else "SW"
                      val u = currentUri
                      if (u != null) startPlayback(u, player.time)
                  }
                  findViewById<View>(R.id.audio).setOnClickListener { chooseAudio() }
                  findViewById<View>(R.id.subs).setOnClickListener { subsMenu() }

                  applyOrientation(resources.configuration)
              }

              private fun toggleUi() {
                  val v = if (panel.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                  panel.visibility = v
                  titleBar.visibility = v
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  applyOrientation(newConfig)
              }

              private fun applyOrientation(c: Configuration) {
                  val ctl = WindowInsetsControllerCompat(window, window.decorView)
                  if (c.orientation == Configuration.ORIENTATION_LANDSCAPE) {
                      panel.visibility = View.GONE
                      titleBar.visibility = View.GONE
                      ctl.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      ctl.hide(WindowInsetsCompat.Type.systemBars())
                  } else {
                      panel.visibility = View.VISIBLE
                      titleBar.visibility = View.VISIBLE
                      ctl.show(WindowInsetsCompat.Type.systemBars())
                  }
              }

              private fun startPlayback(uri: Uri, startMs: Long) {
                  try {
                      pfd?.close()
                      val d = contentResolver.openFileDescriptor(uri, "r") ?: return
                      pfd = d
                      currentUri = uri
                      voutCount = 0
                      val media = Media(libVLC, d.fileDescriptor)
                      media.setHWDecoderEnabled(hw, false)
                      if (startMs > 1000L) media.addOption(":start-time=" + (startMs / 1000L).toString())
                      player.setMedia(media)
                      media.release()
                      player.play()
                      handler.removeCallbacksAndMessages(null)
                      handler.postDelayed({ checkVideo() }, 3000L)
                  } catch (e: Exception) {
                      Toast.makeText(this, "Error al abrir: " + e.message, Toast.LENGTH_LONG).show()
                  }
              }

              private fun checkVideo() {
                  va
