name: Compilar MPC-HC Android

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generar Proyecto MPC-HC
        run: |
          mkdir -p app/src/main/java/com/mpcmovil
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MPCHCMovil"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.mpcmovil'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mpcmovil"
                  minSdk 21
                  targetSdk 34
                  versionCode 4
                  versionName "4.0.0-MPC"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.videolan.android:libvlc-all:3.6.0-eap13'
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_mpc_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#181818" android:pathData="M14,14h80a8,8 0 0,1 8,8v64a8,8 0 0,1 -8,8h-80a8,8 0 0,1 -8,-8v-64a8,8 0 0,1 8,-8z" />
              <path android:fillColor="#2A2A2A" android:pathData="M14,14h80v20h-80z" />
              <path android:fillColor="#E0E0E0" android:pathData="M20,16l10,16h-7l-10,-16z M40,16l10,16h-7l-10,-16z M60,16l10,16h-7l-10,-16z M80,16l10,16h-7l-10,-16z" />
              <path android:fillColor="#2196F3" android:pathData="M44,46l28,17l-28,17z" />
              <path android:strokeColor="#555555" android:strokeWidth="1.5" android:pathData="M14,34h80" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">MPC-HC</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.MPCHC" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#121212</item>
                  <item name="android:statusBarColor">#1A1A1A</item>
                  <item name="android:navigationBarColor">#1A1A1A</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_mpc_logo"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.MPCHC">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|uiMode|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0A0A0A">

              <org.videolan.libvlc.util.VLCVideoLayout
                  android:id="@+id/videoLayout"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_centerInParent="true" />

              <TextView
                  android:id="@+id/txtOsd"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_centerInParent="true"
                  android:background="#C0000000"
                  android:padding="14dp"
                  android:textColor="#FFFFFF"
                  android:textSize="18sp"
                  android:textStyle="bold"
                  android:visibility="gone" />

              <LinearLayout
                  android:id="@+id/welcomeScreen"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:gravity="center"
                  android:background="#161616">

                  <ImageView
                      android:layout_width="100dp"
                      android:layout_height="100dp"
                      android:src="@drawable/ic_mpc_logo" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="14dp"
                      android:text="Media Player Classic"
                      android:textColor="#FFFFFF"
                      android:textSize="20sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Home Cinema"
                      android:textColor="#4EA8DE"
                      android:textSize="17sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="4dp"
                      android:text="Android Edition • LibVLC 60 FPS"
                      android:textColor="#888888"
                      android:textSize="12sp" />

                  <Button
                      android:id="@+id/btnWelcomeOpen"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="22dp"
                      android:text="📁 Abrir Archivo de Vídeo"
                      android:textColor="#FFFFFF"
                      android:background="#2B2B2B"
                      android:paddingStart="20dp"
                      android:paddingEnd="20dp" />
              </LinearLayout>

              <HorizontalScrollView
                  android:id="@+id/topBar"
                  android:layout_width="match_parent"
                  android:layout_height="36dp"
                  android:layout_alignParentTop="true"
                  android:background="#242424"
                  android:scrollbars="none">

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="match_parent"
                      android:gravity="center_vertical">

                      <Button android:id="@+id/btnMenuFile" android:layout_width="wrap_content" android:layout_height="match_parent" android:text="ARCHIVO" android:textColor="#DDD" android:textSize="11sp" android:textStyle="bold" android:background="?android:attr/selectableItemBackground" android:padding="8dp"/>
                      <Button android:id="@+id/btnMenuAudio" android:layout_width="wrap_content" android:layout_height="match_parent" android:text="AUDIO" android:textColor="#DDD" android:textSize="11sp" android:textStyle="bold" android:background="?android:attr/selectableItemBackground" android:padding="8dp"/>
                      <Button android:id="@+id/btnMenuSubtitles" android:layout_width="wrap_content" android:layout_height="match_parent" android:text="SUBTÍTULOS" android:textColor="#DDD" android:textSize="11sp" android:textStyle="bold" android:background="?android:attr/selectableItemBackground" android:padding="8dp"/>
                      <Button android:id="@+id/btnMenuAspect" android:layout_width="wrap_content" android:layout_height="match_parent" android:text="ASPECTO" android:textColor="#DDD" android:textSize="11sp" android:textStyle="bold" android:background="?android:attr/selectableItemBackground" android:padding="8dp"/>
                      <Button android:id="@+id/btnMenuRotate" android:layout_width="wrap_content" android:layout_height="match_parent" android:text="ROTAR [⛶]" android:textColor="#4EA8DE" android:textSize="11sp" android:textStyle="bold" android:background="?android:attr/selectableItemBackground" android:padding="8dp"/>
                  </LinearLayout>
              </HorizontalScrollView>

              <LinearLayout
                  android:id="@+id/bottomBar"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:orientation="vertical"
                  android:background="#202020">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:paddingStart="8dp"
                      android:paddingEnd="8dp">

                      <SeekBar
                          android:id="@+id/seekBar"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:max="1000"
                          android:progressTint="#00ADB5"
                          android:thumbTint="#FFFFFF" />

                      <TextView
                          android:id="@+id/txtTime"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="00:00:00 / 00:00:00"
                          android:textColor="#DDD"
                          android:textSize="11sp"
                          android:fontFamily="monospace" />
                  </LinearLayout>

                  <HorizontalScrollView
                      android:layout_width="match_parent"
                      android:layout_height="40dp"
                      android:scrollbars="none">

                      <LinearLayout
                          android:layout_width="wrap_content"
                          android:layout_height="match_parent"
                          android:gravity="center_vertical"
                          android:paddingStart="6dp"
                          android:paddingEnd="6dp">

                          <Button android:id="@+id/btnPlay" android:layout_width="42dp" android:layout_height="34dp" android:layout_marginEnd="3dp" android:background="#333" android:text="▶" android:textColor="#FFF" android:textSize="12sp" />
                          <Button android:id="@+id/btnPause" android:layout_width="42dp" android:layout_height="34dp" android:layout_marginEnd="3dp" android:background="#333" android:text="❚❚" android:textColor="#F39C12" android:textSize="10sp" />
                          <Button android:id="@+id/btnStop" android:layout_width="42dp" android:layout_height="34dp" android:layout_marginEnd="3dp" android:background="#333" android:text="◼" android:textColor="#E74C3C" android:textSize="10sp" />
                          <Button android:id="@+id/btnBack" android:layout_width="46dp" android:layout_height="34dp" android:layout_marginEnd="3dp" android:background="#333" android:text="◀◀10s" android:textColor="#FFF" android:textSize="8sp" />
                          <Button android:id="@+id/btnForward" android:layout_width="46dp" android:layout_height="34dp" android:layout_marginEnd="3dp" android:background="#333" android:text="10s▶▶" android:textColor="#FFF" android:textSize="8sp" />
                          <Button android:id="@+id/btnSpeed" android:layout_width="50dp" android:layout_height="34dp" android:layout_marginEnd="3dp" android:background="#333" android:text="1.0X" android:textColor="#FFF" android:textSize="9sp" />
                          <Button android:id="@+id/btnHwSw" android:layout_width="50dp" android:layout_height="34dp" android:layout_marginEnd="3dp" android:background="#2E4053" android:text="HW" android:textColor="#2ECC71" android:textStyle="bold" android:textSize="10sp" />
                          <Button android:id="@+id/btnRotateBottom" android:layout_width="42dp" android:layout_height="34dp" android:background="#333" android:text="⛶" android:textColor="#4EA8DE" android:textSize="13sp" />
                      </LinearLayout>
                  </HorizontalScrollView>

                  <LinearLayout
                      android:id="@+id/statusBar"
                      android:layout_width="match_parent"
                      android:layout_height="22dp"
                      android:background="#141414"
                      android:gravity="center_vertical"
                      android:paddingStart="8dp"
                      android:paddingEnd="8dp">

                      <TextView android:id="@+id/txtStatus" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="Detenido" android:textColor="#AAA" android:textSize="11sp" />
                      <TextView android:id="@+id/txtDecoderInfo" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="[HW | 60 FPS]" android:textColor="#4EA8DE" android:textSize="11sp" />
                  </LinearLayout>
              </LinearLayout>
          </RelativeLayout>
          EOF run: cat << 'EOF' > gradle.properties
android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
EOF

          cat << 'EOF' > app/src/main/java/com/mpcmovil/MainActivity.kt
          package com.mpcmovil

          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.ActivityInfo
          import android.content.res.Configuration
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import org.videolan.libvlc.*
          import org.videolan.libvlc.util.VLCVideoLayout
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private lateinit var vLayout: VLCVideoLayout
              private lateinit var welcome: View
              private lateinit var topBar: View
              private lateinit var botBar: View
              private lateinit var txtStat: TextView
              private lateinit var txtDec: TextView
              private lateinit var txtTime: TextView
              private lateinit var txtOsd: TextView
              private lateinit var seek: SeekBar
              private lateinit var btnPlay: Button
              private lateinit var btnHw: Button
              private lateinit var btnSpd: Button

              private var vlc: LibVLC? = null
              private var player: MediaPlayer? = null
              private var curUri: Uri? = null
              private var isHw = true
              private var isUi = true
              private var rot = 0
              private var asp = 0
              private val spds = floatArrayOf(0.5f, 0.75f, 1.0f, 1.25f, 1.5f, 2.0f)
              private var spdIdx = 2
              private val handler = Handler(Looper.getMainLooper())
              private var seeking = false
              private lateinit var gesture: GestureDetector

              private val picker = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { res ->
                  if (res.resultCode == RESULT_OK) res.data?.data?.let { play(it) }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  setContentView(R.layout.activity_main)

                  vLayout = findViewById(R.id.videoLayout)
                  welcome = findViewById(R.id.welcomeScreen)
                  topBar = findViewById(R.id.topBar)
                  botBar = findViewById(R.id.bottomBar)
                  txtStat = findViewById(R.id.txtStatus)
                  txtDec = findViewById(R.id.txtDecoderInfo)
                  txtTime = findViewById(R.id.txtTime)
                  txtOsd = findViewById(R.id.txtOsd)
                  seek = findViewById(R.id.seekBar)
                  btnPlay = findViewById(R.id.btnPlay)
                  btnHw = findViewById(R.id.btnHwSw)
                  btnSpd = findViewById(R.id.btnSpeed)

                  findViewById<View>(R.id.btnWelcomeOpen).setOnClickListener { openFile() }
                  findViewById<View>(R.id.btnMenuFile).setOnClickListener { openFile() }
                  findViewById<View>(R.id.btnMenuAudio).setOnClickListener { pickAudio() }
                  findViewById<View>(R.id.btnMenuSubtitles).setOnClickListener { pickSubs() }
                  findViewById<View>(R.id.btnMenuAspect).setOnClickListener { toggleAspect() }

                  val rotFn = { toggleRot() }
                  findViewById<View>(R.id.btnMenuRotate).setOnClickListener { rotFn() }
                  findViewById<View>(R.id.btnRotateBottom).setOnClickListener { rotFn() }

                  btnPlay.setOnClickListener { player?.let { if (it.isPlaying) it.pause() else it.play() } }
                  findViewById<View>(R.id.btnPause).setOnClickListener { player?.pause() }
                  findViewById<View>(R.id.btnStop).setOnClickListener {
                      player?.stop()
                      welcome.visibility = View.VISIBLE
                      txtStat.text = "Detenido"
                      txtTime.text = "00:00:00 / 00:00:00"
                      seek.progress = 0
                  }
                  findViewById<View>(R.id.btnBack).setOnClickListener {
                      player?.let { it.time = (it.time - 10000L).coerceAtLeast(0L); osd("-10s") }
                  }
                  findViewById<View>(R.id.btnForward).setOnClickListener {
                      player?.let { it.time = (it.time + 10000L).coerceAtMost(it.length); osd("+10s") }
                  }
                  btnSpd.setOnClickListener {
                      spdIdx = (spdIdx + 1) % spds.size
                      player?.rate = spds[spdIdx]
                      btnSpd.text = "${spds[spdIdx]}X"
                      osd("Velocidad: ${spds[spdIdx]}X")
                  }
                  btnHw.setOnClickListener {
                      isHw = !isHw
                      updateDec()
                      osd(if (isHw) "Decodificador HW" else "Decodificador SW")
                      curUri?.let { u -> val pos = player?.time ?: 0L; resetPlayer(); play(u, pos) }
                  }

                  seek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          if (fromUser && player != null && player!!.length > 0) {
                              val t = (player!!.length * (p / 1000f)).toLong()
                              txtTime.text = "${fmt(t)} / ${fmt(player!!.length)}"
                          }
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) { seeking = true }
                      override fun onStopTrackingTouch(s: SeekBar?) {
                          seeking = false
                          player?.let { if (it.length > 0) it.time = (it.length * (seek.progress / 1000f)).toLong() }
                      }
                  })

                  gesture = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                          isUi = !isUi
                          val v = if (isUi) View.VISIBLE else View.GONE
                          topBar.visibility = v
                          botBar.visibility = v
                          return true
                      }
                      override fun onDoubleTap(e: MotionEvent): Boolean {
                          player?.let { if (it.isPlaying) it.pause() else it.play() }
                          return true
                      }
                  })
                  vLayout.setOnTouchListener { _, ev -> gesture.onTouchEvent(ev); true }

                  initPlayer()
                  intent?.data?.let { play(it) }
              }

              private fun initPlayer() {
                  val opts = ArrayList<String>()
                  opts.add("--file-caching=2000")
                  opts.add("--avcodec-threads=4")
                  opts.add("--avcodec-fast")
                  if (isHw) opts.add("--codec=mediacodec_ndk,mediacodec_jni,all")
                  else { opts.add("--codec=all"); opts.add("--avcodec-hw=none") }

                  vlc = LibVLC(this, opts)
                  player = MediaPlayer(vlc)
                  player?.attachViews(vLayout, null, false, false)
                  player?.setEventListener { ev ->
                      when (ev.type) {
                          MediaPlayer.Event.Playing -> { welcome.visibility = View.GONE; txtStat.text = "Reproduciendo"; btnPlay.text = "❚❚" }
                          MediaPlayer.Event.Paused -> { txtStat.text = "Pausa"; btnPlay.text = "▶" }
                          MediaPlayer.Event.Stopped -> { welcome.visibility = View.VISIBLE; txtStat.text = "Detenido"; btnPlay.text = "▶" }
                          MediaPlayer.Event.TimeChanged -> {
                              if (!seeking && player != null && player!!.length > 0) {
                                  val t = player!!.time
                                  val l = player!!.length
                                  seek.progress = ((t.toFloat() / l) * 1000).toInt()
                                  txtTime.text = "${fmt(t)} / ${fmt(l)}"
                              }
                          }
                          MediaPlayer.Event.EncounteredError -> {
                              txtStat.text = "Error"
                              Toast.makeText(this, "Toca [HW/SW] si la pantalla no carga", Toast.LENGTH_LONG).show()
                          }
                      }
                  }
                  updateDec()
              }

              private fun resetPlayer() {
                  player?.stop()
                  player?.detachViews()
                  player?.release()
                  vlc?.release()
                  initPlayer()
              }

              private fun play(uri: Uri, pos: Long = 0L) {
                  curUri = uri
                  try {
                      val pfd = contentResolver.openFileDescriptor(uri, "r") ?: return
                      val m = Media(vlc, pfd.fileDescriptor)
                      m.addOption(":file-caching=2000")
                      if (!isHw) m.addOption(":avcodec-hw=none")
                      player?.media = m
                      m.release()
                      player?.play()
                      if (pos > 0) handler.postDelayed({ player?.time = pos }, 250)
                      welcome.visibility = View.GONE
                  } catch (e: Exception) {
                      Toast.makeText(this, "Error: ${e.message}", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun openFile() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "video/*"
                  }
                  picker.launch(i)
              }

              private fun toggleRot() {
                  rot = (rot + 1) % 3
                  when (rot) {
                      0 -> { requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR; osd("Pantalla: Auto") }
                      1 -> { requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE; osd("Pantalla: Horizontal") }
                      2 -> { requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT; osd("Pantalla: Vertical") }
                  }
                  vLayout.post { vLayout.requestLayout() }
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  vLayout.post { vLayout.requestLayout() }
              }

              private fun toggleAspect() {
                  val list = arrayOf("Auto", "16:9", "4:3", "fill")
                  asp = (asp + 1) % list.size
                  player?.aspectRatio = if (asp == 0) null else list[asp]
                  osd("Aspecto: ${list[asp]}")
              }

              private fun pickAudio() {
                  val t = player?.audioTracks ?: return
                  if (t.isEmpty()) return
                  val names = t.map { it.name }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Pista de Audio")
                      .setItems(names) { _, i -> player?.audioTrack = t[i].id; osd("Audio: ${t[i].name}") }
                      .show()
              }

              private fun pickSubs() {
                  val t = player?.spuTracks ?: return
                  if (t.isEmpty()) return
                  val names = t.map { it.name }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Subtítulos")
                      .setItems(names) { _, i -> player?.spuTrack = t[i].id; osd("Subs: ${t[i].name}") }
                      .show()
              }

              private fun osd(msg: String) {
                  txtOsd.text = msg
                  txtOsd.visibility = View.VISIBLE
                  handler.removeCallbacks(osdRun)
                  handler.postDelayed(osdRun, 1500)
              }
              private val osdRun = Runnable { txtOsd.visibility = View.GONE }

              private fun updateDec() {
                  if (isHw) {
                      btnHw.text = "HW"
                      btnHw.setTextColor(0xFF2ECC71.toInt())
                      txtDec.text = "[HW | 60 FPS]"
                  } else {
                      btnHw.text = "SW"
                      btnHw.setTextColor(0xFFE67E22.toInt())
                      txtDec.text = "[SW | Hi10P]"
                  }
              }

              private fun fmt(ms: Long): String {
                  val s = (ms / 1000) % 60
                  val m = (ms / 60000) % 60
                  val h = ms / 3600000
                  return String.format(Locale.US, "%02d:%02d:%02d", h, m, s)
              }

              override fun onPause() { super.onPause(); player?.pause() }
              override fun onDestroy() { super.onDestroy(); player?.release(); vlc?.release() }
          }
          EOF

          cat << 'EOF' > gradle.properties
android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
EOF
          # Compilar APK directamente
          gradle assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --no-daemon --stacktrace
      - name: Subir APK Generado a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MPC-HC-Android-v4.0
          path: app/build/outputs/apk/debug/app-debug.apk
