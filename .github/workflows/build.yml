name: Compilar MPC-HC
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generar Proyecto
        run: |
          mkdir -p app/src/main/java/com/mpcmovil app/src/main/res/layout
          echo "android.useAndroidX=true" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g" >> gradle.properties

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "MpcMovil"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.mpcmovil"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.mpcmovil"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 7
                  versionName = "3.4"
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("org.videolan.android:libvlc-all:3.6.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application android:label="MPC-HC" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000">

              <org.videolan.libvlc.util.VLCVideoLayout
                  android:id="@+id/vlc" android:layout_width="match_parent" android:layout_height="match_parent" android:keepScreenOn="true"/>

              <View android:id="@+id/touch" android:layout_width="match_parent" android:layout_height="match_parent"/>

              <LinearLayout android:id="@+id/topBar" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_alignParentTop="true" android:background="#9915171A" android:orientation="horizontal" android:padding="2dp">
                  <Button android:id="@+id/mFile" android:layout_width="wrap_content" android:layout_height="36dp" android:text="Archivo" android:textSize="11sp" style="?android:attr/borderlessButtonStyle" android:textColor="#E0E0E0"/>
                  <Button android:id="@+id/mAudio" android:layout_width="wrap_content" android:layout_height="36dp" android:text="Audio" android:textSize="11sp" style="?android:attr/borderlessButtonStyle" android:textColor="#E0E0E0"/>
                  <Button android:id="@+id/mSubs" android:layout_width="wrap_content" android:layout_height="36dp" android:text="Subtítulos" android:textSize="11sp" style="?android:attr/borderlessButtonStyle" android:textColor="#E0E0E0"/>
                  <Button android:id="@+id/mAspect" android:layout_width="wrap_content" android:layout_height="36dp" android:text="Aspecto" android:textSize="11sp" style="?android:attr/borderlessButtonStyle" android:textColor="#E0E0E0"/>
              </LinearLayout>

              <LinearLayout android:id="@+id/botBar" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true" android:background="#E6181A1D" android:orientation="vertical">

                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="center_vertical" android:paddingStart="8dp" android:paddingEnd="8dp">
                      <SeekBar android:id="@+id/seek" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:max="1000"/>
                      <TextView android:id="@+id/tTime" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="00:00:00 / 00:00:00" android:textColor="#E0E0E0" android:textSize="11sp" android:fontFamily="monospace"/>
                  </LinearLayout>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="center_vertical" android:orientation="horizontal" android:paddingStart="6dp" android:paddingEnd="6dp" android:paddingBottom="4dp">
                      <Button android:id="@+id/bPlay" android:layout_width="44dp" android:layout_height="38dp" android:text="▶" android:textSize="14sp"/>
                      <Button android:id="@+id/bPause" android:layout_width="44dp" android:layout_height="38dp" android:text="⏸" android:textSize="12sp"/>
                      <Button android:id="@+id/bStop" android:layout_width="44dp" android:layout_height="38dp" android:text="◼" android:textSize="12sp"/>
                      <Button android:id="@+id/bBack" android:layout_width="48dp" android:layout_height="38dp" android:text="◀◀" android:textSize="11sp"/>
                      <Button android:id="@+id/bFwd" android:layout_width="48dp" android:layout_height="38dp" android:text="▶▶" android:textSize="11sp"/>
                      <Button android:id="@+id/bSpd" android:layout_width="50dp" android:layout_height="38dp" android:text="1.0x" android:textSize="11sp"/>
                      <Button android:id="@+id/bHw" android:layout_width="52dp" android:layout_height="38dp" android:text="HW" android:textStyle="bold" android:textSize="11sp"/>
                      <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/>
                      <Button android:id="@+id/bOpen" android:layout_width="wrap_content" android:layout_height="38dp" android:text="📂 Abrir" android:textSize="11sp"/>
                  </LinearLayout>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="22dp" android:background="#101113" android:gravity="center_vertical" android:orientation="horizontal" android:paddingStart="8dp" android:paddingEnd="8dp">
                      <TextView android:id="@+id/tStatus" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="Detenido" android:textColor="#A0A0A0" android:textSize="10sp" android:fontFamily="monospace"/>
                      <TextView android:id="@+id/tCodec" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="[Modo HW]" android:textColor="#00D2FF" android:textSize="10sp" android:fontFamily="monospace"/>
                  </LinearLayout>
              </LinearLayout>
          </RelativeLayout>
          EOF

          cat > app/src/main/java/com/mpcmovil/MainActivity.kt <<'EOF'
          package com.mpcmovil

          import android.net.Uri
          import android.os.*
          import android.view.View
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import org.videolan.libvlc.*
          import org.videolan.libvlc.util.VLCVideoLayout
          import java.io.File

          class MainActivity : AppCompatActivity() {
              private lateinit var vlc: LibVLC
              private lateinit var player: MediaPlayer
              private lateinit var topBar: View
              private lateinit var botBar: View
              private lateinit var tStatus: TextView
              private lateinit var tTime: TextView
              private lateinit var tCodec: TextView
              private lateinit var bHw: Button
              private lateinit var seek: SeekBar
              private var pfd: ParcelFileDescriptor? = null
              private var curUri: Uri? = null
              private var isHw = true
              private val spds = floatArrayOf(0.5f, 0.75f, 1f, 1.25f, 1.5f, 2f)
              private var spdIdx = 2
              private var seeking = false
              private var visible = true
              private val handler = Handler(Looper.getMainLooper())
              private val hideTask = Runnable { setControls(false) }

              private val pickVideo = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null) { curUri = uri; play(uri, isHw) }
              }
              private val pickSubs = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null) addSub(uri)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  topBar = findViewById(R.id.topBar)
                  botBar = findViewById(R.id.botBar)
                  tStatus = findViewById(R.id.tStatus)
                  tTime = findViewById(R.id.tTime)
                  tCodec = findViewById(R.id.tCodec)
                  bHw = findViewById(R.id.bHw)
                  seek = findViewById(R.id.seek)
                  val video = findViewById<VLCVideoLayout>(R.id.vlc)
                  val touch = findViewById<View>(R.id.touch)

                  // Optimizado para Anime 10-bit en todos los núcleos
                  vlc = LibVLC(this, arrayListOf("--avcodec-threads=0", "--aout=opensles", "--audio-time-stretch"))
                  player = MediaPlayer(vlc)
                  player.attachViews(video, null, true, true)

                  player.setEventListener { e ->
                      when (e.type) {
                          MediaPlayer.Event.TimeChanged -> runOnUiThread {
                              val total = player.length
                              if (!seeking && total > 0) seek.progress = (player.time * 1000 / total).toInt()
                              tTime.text = "${fmt(player.time)} / ${fmt(total)}"
                          }
                          MediaPlayer.Event.Playing -> runOnUiThread { tStatus.text = "Reproduciendo"; schedHide() }
                          MediaPlayer.Event.Paused -> runOnUiThread { tStatus.text = "En pausa"; setControls(true) }
                          MediaPlayer.Event.Stopped -> runOnUiThread { tStatus.text = "Detenido"; seek.progress = 0; tTime.text = "00:00:00 / 00:00:00"; setControls(true) }
                          MediaPlayer.Event.EncounteredError -> runOnUiThread {
                              tStatus.text = "Error de video"
                              Toast.makeText(this, "Toca el botón HW/SW si la pantalla está en negro", Toast.LENGTH_LONG).show()
                          }
                      }
                  }

                  touch.setOnClickListener { setControls(!visible) }

                  seek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) {
                          val l = player.length; if (fromUser && l > 0) player.setTime(p * l / 1000)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) { seeking = true; handler.removeCallbacks(hideTask) }
                      override fun onStopTrackingTouch(sb: SeekBar?) { seeking = false; schedHide() }
                  })

                  // Botón HW / SW para Anime
                  bHw.setOnClickListener {
                      isHw = !isHw; updateHwLabel()
                      curUri?.let { u ->
                          val pos = player.time; play(u, isHw)
                          handler.postDelayed({ if (pos > 0) player.time = pos }, 300)
                          Toast.makeText(this, if (isHw) "Modo HW" else "Modo SW (Anime 10-bit)", Toast.LENGTH_SHORT).show()
                      }
                  }

                  findViewById<Button>(R.id.bOpen).setOnClickListener { pickVideo.launch(arrayOf("video/*", "audio/*", "*/*")) }
                  findViewById<Button>(R.id.mFile).setOnClickListener { pickVideo.launch(arrayOf("video/*", "audio/*", "*/*")) }
                  findViewById<Button>(R.id.bPlay).setOnClickListener { player.play() }
                  findViewById<Button>(R.id.bPause).setOnClickListener { player.pause() }
                  findViewById<Button>(R.id.bStop).setOnClickListener { player.stop() }
                  findViewById<Button>(R.id.bBack).setOnClickListener { player.setTime(maxOf(0L, player.time - 10000L)); schedHide() }
                  findViewById<Button>(R.id.bFwd).setOnClickListener { player.setTime(player.time + 10000L); schedHide() }
                  findViewById<Button>(R.id.bSpd).setOnClickListener { b ->
                      spdIdx = (spdIdx + 1) % spds.size; player.setRate(spds[spdIdx]); (b as Button).text = "${spds[spdIdx]}x"; schedHide()
                  }

                  findViewById<Button>(R.id.mAudio).setOnClickListener { audioMenu() }
                  findViewById<Button>(R.id.mSubs).setOnClickListener { subsMenu() }
                  findViewById<Button>(R.id.mAspect).setOnClickListener { aspectMenu() }

                  updateHwLabel(); setControls(true)
              }

              private fun updateHwLabel() {
                  bHw.text = if (isHw) "HW" else "SW"
                  tCodec.text = if (isHw) "[Modo HW]" else "[Modo SW (CPU Anime)]"
              }

              private fun setControls(show: Boolean) {
                  topBar.visibility = if (show) View.VISIBLE else View.GONE
                  botBar.visibility = if (show) View.VISIBLE else View.GONE
                  visible = show
                  if (show && player.isPlaying) schedHide()
              }

              private fun schedHide() {
                  handler.removeCallbacks(hideTask)
                  handler.postDelayed(hideTask, 4000)
              }

              private fun play(uri: Uri, hw: Boolean) {
                  try {
                      pfd?.close()
                      val d = contentResolver.openFileDescriptor(uri, "r") ?: return
                      pfd = d
                      val m = Media(vlc, d.fileDescriptor)
                      m.setHWDecoderEnabled(hw, false)
                      player.media = m
                      m.release()
                      player.play()
                      setControls(true)
                  } catch (e: Exception) {
                      Toast.makeText(this, "Error: ${e.message}", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun addSub(uri: Uri) {
                  try {
                      val f = File(cacheDir, "sub_${System.currentTimeMillis()}.ass")
                      contentResolver.openInputStream(uri)?.use { i -> f.outputStream().use { o -> i.copyTo(o) } }
                      player.addSlave(0, Uri.fromFile(f), true)
                      Toast.makeText(this, "Subtítulo cargado", Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Error al cargar subtítulo", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun subsMenu() {
                  val items = arrayOf("Cargar subtítulo (.ass/.srt)", "Pistas del MKV", "Desactivar")
                  AlertDialog.Builder(this).setTitle("Subtítulos").setItems(items) { _, i ->
                      when (i) {
                          0 -> pickSubs.launch(arrayOf("*/*"))
                          1 -> {
                              val tr = player.spuTracks
                              if (tr.isNullOrEmpty()) Toast.makeText(this, "Sin pistas", Toast.LENGTH_SHORT).show()
                              else AlertDialog.Builder(this).setTitle("Pista").setItems(tr.map { it.name }.toTypedArray()) { _, k -> player.setSpuTrack(tr[k].id) }.show()
                          }
                          2 -> player.setSpuTrack(-1)
                      }
                  }.show()
              }

              private fun audioMenu() {
                  val tr = player.audioTracks
                  if (tr.isNullOrEmpty() || tr.size <= 1) { Toast.makeText(this, "Solo 1 pista de audio", Toast.LENGTH_SHORT).show(); return }
                  AlertDialog.Builder(this).setTitle("Pista de Audio").setItems(tr.map { it.name }.toTypedArray()) { _, k -> player.setAudioTrack(tr[k].id) }.show()
              }

              private fun aspectMenu() {
                  val opts = arrayOf("Original", "16:9", "4:3 (Anime Clásico)", "Rellenar")
                  AlertDialog.Builder(this).setTitle("Aspecto").setItems(opts) { _, i ->
                      when (i) { 0 -> player.aspectRatio = null; 1 -> player.aspectRatio = "16:9"; 2 -> player.aspectRatio = "4:3"; 3 -> player.scale = 0f }
                  }.show()
              }

              private fun fmt(ms: Long): String {
                  val s = maxOf(0L, ms) / 1000
                  val h = s / 3600; val m = (s % 3600) / 60; val sec = s % 60
                  return if (h > 0) String.format("%02d:%02d:%02d", h, m, sec) else String.format("%02d:%02d", m, sec)
              }

              override fun onStop() { super.onStop(); player.pause() }
              override fun onDestroy() { super.onDestroy(); handler.removeCallbacks(hideTask); player.detachViews(); player.release(); vlc.release(); pfd?.close() }
          }
          EOF

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v3.4.${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "MPC-HC v3.4" \
            --notes "APK completo compatible con Anime 10-bit y boton HW/SW"
# --- FIN DEL ARCHIVO ---
