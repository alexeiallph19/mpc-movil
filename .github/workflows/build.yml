name: Compilar MPC-HC Android

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generar Proyecto MPC-HC
        run: |
          mkdir -p app/src/main/java/com/mpcmovil
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MPCHCMovil"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.mpcmovil'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mpcmovil"
                  minSdk 21
                  targetSdk 34
                  versionCode 4
                  versionName "4.0.0-MPC"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.videolan.android:libvlc-all:3.6.0-eap13'
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_mpc_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#181818" android:pathData="M14,14h80a8,8 0 0,1 8,8v64a8,8 0 0,1 -8,8h-80a8,8 0 0,1 -8,-8v-64a8,8 0 0,1 8,-8z" />
              <path android:fillColor="#2A2A2A" android:pathData="M14,14h80v20h-80z" />
              <path android:fillColor="#E0E0E0" android:pathData="M20,16l10,16h-7l-10,-16z M40,16l10,16h-7l-10,-16z M60,16l10,16h-7l-10,-16z M80,16l10,16h-7l-10,-16z" />
              <path android:fillColor="#2196F3" android:pathData="M44,46l28,17l-28,17z" />
              <path android:strokeColor="#555555" android:strokeWidth="1.5" android:pathData="M14,34h80" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">MPC-HC</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.MPCHC" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#121212</item>
                  <item name="android:statusBarColor">#1A1A1A</item>
                  <item name="android:navigationBarColor">#1A1A1A</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_mpc_logo"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.MPCHC">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|uiMode|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0A0A0A">

              <org.videolan.libvlc.util.VLCVideoLayout
                  android:id="@+id/videoLayout"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_centerInParent="true" />

              <TextView
                  android:id="@+id/txtOsd"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_centerInParent="true"
                  android:background="#C0000000"
                  android:padding="14dp"
                  android:textColor="#FFFFFF"
                  android:textSize="18sp"
                  android:textStyle="bold"
                  android:visibility="gone" />

              <LinearLayout
                  android:id="@+id/welcomeScreen"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:gravity="center"
                  android:background="#161616">

                  <ImageView
                      android:layout_width="100dp"
                      android:layout_height="100dp"
                      android:src="@drawable/ic_mpc_logo" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="14dp"
                      android:text="Media Player Classic"
                      android:textColor="#FFFFFF"
                      android:textSize="20sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Home Cinema"
                      android:textColor="#4EA8DE"
                      android:textSize="17sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="4dp"
                      android:text="Android Edition • LibVLC 60 FPS"
                      android:textColor="#888888"
                      android:textSize="12sp" />

                  <Button
                      android:id="@+id/btnWelcomeOpen"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="22dp"
                      android:text="📁 Abrir Archivo de Vídeo"
                      android:textColor="#FFFFFF"
                      android:background="#2B2B2B"
                      android:paddingStart="20dp"
                      android:paddingEnd="20dp" />
              </LinearLayout>

              <HorizontalScrollView
                  android:id="@+id/topBar"
                  android:layout_width="match_parent"
                  android:layout_height="36dp"
                  android:layout_alignParentTop="true"
                  android:background="#242424"
                  android:scrollbars="none">

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="match_parent"
                      android:gravity="center_vertical">

                      <Button android:id="@+id/btnMenuFile" android:layout_width="wrap_content" android:layout_height="match_parent" android:text="ARCHIVO" android:textColor="#DDD" android:textSize="11sp" android:textStyle="bold" android:background="?android:attr/selectableItemBackground" android:padding="8dp"/>
                      <Button android:id="@+id/btnMenuAudio" android:layout_width="wrap_content" android:layout_height="match_parent" android:text="AUDIO" android:textColor="#DDD" android:textSize="11sp" android:textStyle="bold" android:background="?android:attr/selectableItemBackground" android:padding="8dp"/>
                      <Button android:id="@+id/btnMenuSubtitles" android:layout_width="wrap_content" android:layout_height="match_parent" android:text="SUBTÍTULOS" android:textColor="#DDD" android:textSize="11sp" android:textStyle="bold" android:background="?android:attr/selectableItemBackground" android:padding="8dp"/>
                      <Button android:id="@+id/btnMenuAspect" android:layout_width="wrap_content" android:layout_height="match_parent" android:text="ASPECTO" android:textColor="#DDD" android:textSize="11sp" android:textStyle="bold" android:background="?android:attr/selectableItemBackground" android:padding="8dp"/>
                      <Button android:id="@+id/btnMenuRotate" android:layout_width="wrap_content" android:layout_height="match_parent" android:text="ROTAR [⛶]" android:textColor="#4EA8DE" android:textSize="11sp" android:textStyle="bold" android:background="?android:attr/selectableItemBackground" android:padding="8dp"/>
                  </LinearLayout>
              </HorizontalScrollView>

              <LinearLayout
                  android:id="@+id/bottomBar"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:orientation="vertical"
                  android:background="#202020">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:paddingStart="8dp"
                      android:paddingEnd="8dp">

                      <SeekBar
                          android:id="@+id/seekBar"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:max="1000"
                          android:progressTint="#00ADB5"
                          android:thumbTint="#FFFFFF" />

                      <TextView
                          android:id="@+id/txtTime"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="00:00:00 / 00:00:00"
                          android:textColor="#DDD"
                          android:textSize="11sp"
                          android:fontFamily="monospace" />
                  </LinearLayout>

                  <HorizontalScrollView
                      android:layout_width="match_parent"
                      android:layout_height="40dp"
                      android:scrollbars="none">

                      <LinearLayout
                          android:layout_width="wrap_content"
                          android:layout_height="match_parent"
                          android:gravity="center_vertical"
                          android:paddingStart="6dp"
                          android:paddingEnd="6dp">

                          <Button android:id="@+id/btnPlay" android:layout_width="42dp" android:layout_height="34dp" android:layout_marginEnd="3dp" android:background="#333" android:text="▶" android:textColor="#FFF" android:textSize="12sp" />
                          <Button android:id="@+id/btnPause" android:layout_width="42dp" android:layout_height="34dp" android:layout_marginEnd="3dp" android:background="#333" android:text="❚❚" android:textColor="#F39C12" android:textSize="10sp" />
                          <Button android:id="@+id/btnStop" android:layout_width="42dp" android:layout_height="34dp" android:layout_marginEnd="3dp" android:background="#333" android:text="◼" android:textColor="#E74C3C" android:textSize="10sp" />
                          <Button android:id="@+id/btnBack" android:layout_width="46dp" android:layout_height="34dp" android:layout_marginEnd="3dp" android:background="#333" android:text="◀◀10s" android:textColor="#FFF" android:textSize="8sp" />
                          <Button android:id="@+id/btnForward" android:layout_width="46dp" android:layout_height="34dp" android:layout_marginEnd="3dp" android:background="#333" android:text="10s▶▶" android:textColor="#FFF" android:textSize="8sp" />
                          <Button android:id="@+id/btnSpeed" android:layout_width="50dp" android:layout_height="34dp" android:layout_marginEnd="3dp" android:background="#333" android:text="1.0X" android:textColor="#FFF" android:textSize="9sp" />
                          <Button android:id="@+id/btnHwSw" android:layout_width="50dp" android:layout_height="34dp" android:layout_marginEnd="3dp" android:background="#2E4053" android:text="HW" android:textColor="#2ECC71" android:textStyle="bold" android:textSize="10sp" />
                          <Button android:id="@+id/btnRotateBottom" android:layout_width="42dp" android:layout_height="34dp" android:background="#333" android:text="⛶" android:textColor="#4EA8DE" android:textSize="13sp" />
                      </LinearLayout>
                  </HorizontalScrollView>

                  <LinearLayout
                      android:id="@+id/statusBar"
                      android:layout_width="match_parent"
                      android:layout_height="22dp"
                      android:background="#141414"
                      android:gravity="center_vertical"
                      android:paddingStart="8dp"
                      android:paddingEnd="8dp">

                      <TextView android:id="@+id/txtStatus" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="Detenido" android:textColor="#AAA" android:textSize="11sp" />
                      <TextView android:id="@+id/txtDecoderInfo" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="[HW | 60 FPS]" android:textColor="#4EA8DE" android:textSize="11sp" />
                  </LinearLayout>
              </LinearLayout>
          </RelativeLayout>
          EOF
          cat << 'EOF' > app/src/main/java/com/mpcmovil/MainActivity.kt
          package com.mpcmovil

          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.ActivityInfo
          import android.content.res.Configuration
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import org.videolan.libvlc.*
          import org.videolan.libvlc.util.VLCVideoLayout
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private lateinit var videoLayout: VLCVideoLayout
              private lateinit var welcomeScreen: View
              private lateinit var topBar: View
              private lateinit var bottomBar: View
              private lateinit var txtStatus: TextView
              private lateinit var txtDecoderInfo: TextView
              private lateinit var txtTime: TextView
              private lateinit var txtOsd: TextView
              private lateinit var seekBar: SeekBar
              private lateinit var btnPlay: Button
              private lateinit var btnHwSw: Button
              private lateinit var btnSpeed: Button

              private var libVLC: LibVLC? = null
              private var mediaPlayer: MediaPlayer? = null
              private var currentUri: Uri? = null
              private var isHw = true
              private var isControlsVisible = true
              private var aspectIndex = 0
              private var rotationMode = 0
              private val speeds = floatArrayOf(0.5f, 0.75f, 1.0f, 1.25f, 1.5f, 2.0f)
              private var speedIndex = 2
              private val aspects = arrayOf("Auto", "16:9", "4:3", "Rellenar", "Estirar")

              private val handler = Handler(Looper.getMainLooper())
              private var isSeeking = false
              private lateinit var gestureDetector: GestureDetector

              private val fileLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { res ->
                  if (res.resultCode == RESULT_OK) {
                      res.data?.data?.let { play(it) }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  setContentView(R.layout.activity_main)

                  initViews()
                  initGestures()
                  initPlayer()

                  intent?.data?.let { play(it) }
              }

              private fun initViews() {
                  videoLayout = findViewById(R.id.videoLayout)
                  welcomeScreen = findViewById(R.id.welcomeScreen)
                  topBar = findViewById(R.id.topBar)
                  bottomBar = findViewById(R.id.bottomBar)
                  txtStatus = findViewById(R.id.txtStatus)
                  txtDecoderInfo = findViewById(R.id.txtDecoderInfo)
                  txtTime = findViewById(R.id.txtTime)
                  txtOsd = findViewById(R.id.txtOsd)
                  seekBar = findViewById(R.id.seekBar)
                  btnPlay = findViewById(R.id.btnPlay)
                  btnHwSw = findViewById(R.id.btnHwSw)
                  btnSpeed = findViewById(R.id.btnSpeed)

                  findViewById<Button>(R.id.btnWelcomeOpen).setOnClickListener { pickFile() }
                  findViewById<Button>(R.id.btnMenuFile).setOnClickListener { pickFile() }
                  findViewById<Button>(R.id.btnMenuAudio).setOnClickListener { pickAudio() }
                  findViewById<Button>(R.id.btnMenuSubtitles).setOnClickListener { pickSubtitles() }
                  findViewById<Button>(R.id.btnMenuAspect).setOnClickListener { cycleAspect() }

                  val rotLambda = { cycleRotation() }
                  findViewById<Button>(R.id.btnMenuRotate).setOnClickListener { rotLambda() }
                  findViewById<Button>(R.id.btnRotateBottom).setOnClickListener { rotLambda() }

                  btnPlay.setOnClickListener {
                      mediaPlayer?.let { p -> if (p.isPlaying) p.pause() else p.play() }
                  }
                  findViewById<Button>(R.id.btnPause).setOnClickListener { mediaPlayer?.pause() }

                  findViewById<Button>(R.id.btnStop).setOnClickListener {
                      mediaPlayer?.stop()
                      welcomeScreen.visibility = View.VISIBLE
                      txtStatus.text = "Detenido"
                      txtTime.text = "00:00:00 / 00:00:00"
                      seekBar.progress = 0
                  }

                  findViewById<Button>(R.id.btnBack).setOnClickListener {
                      mediaPlayer?.let { p ->
                          p.time = (p.time - 10000L).coerceAtLeast(0L)
                          showOsd("-10s (${formatTime(p.time)})")
                      }
                  }

                  findViewById<Button>(R.id.btnForward).setOnClickListener {
                      mediaPlayer?.let { p ->
                          p.time = (p.time + 10000L).coerceAtMost(p.length)
                          showOsd("+10s (${formatTime(p.time)})")
                      }
                  }

                  btnSpeed.setOnClickListener {
                      speedIndex = (speedIndex + 1) % speeds.size
                      val spd = speeds[speedIndex]
                      mediaPlayer?.rate = spd
                      btnSpeed.text = "${spd}X"
                      showOsd("Velocidad: ${spd}X")
                  }

                  btnHwSw.setOnClickListener {
                      isHw = !isHw
                      updateDecoderUi()
                      showOsd(if (isHw) "Decodificador Hardware (HW)" else "Decodificador Software (SW)")
                      currentUri?.let { u ->
                          val pos = mediaPlayer?.time ?: 0L
                          rebuildPlayer()
                          play(u, pos)
                      }
                  }

                  seekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (fromUser && mediaPlayer != null) {
                              val len = mediaPlayer!!.length
                              if (len > 0) {
                                  val t = (len * (progress / 1000f)).toLong()
                                  txtTime.text = "${formatTime(t)} / ${formatTime(len)}"
                              }
                          }
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) { isSeeking = true }
                      override fun onStopTrackingTouch(sb: SeekBar?) {
                          isSeeking = false
                          mediaPlayer?.let { p ->
                              if (p.length > 0) p.time = (p.length * (seekBar.progress / 1000f)).toLong()
                          }
                      }
                  })
              }

              private fun initPlayer() {
                  val opts = ArrayList<String>()
                  opts.add("--file-caching=2000")
                  opts.add("--network-caching=2000")
                  opts.add("--avcodec-threads=4")
                  opts.add("--avcodec-fast")
                  if (isHw) {
                      opts.add("--codec=mediacodec_ndk,mediacodec_jni,all")
                  } else {
                      opts.add("--codec=all")
                      opts.add("--avcodec-hw=none")
                  }

                  libVLC = LibVLC(this, opts)
                  mediaPlayer = MediaPlayer(libVLC)
                  mediaPlayer?.attachViews(videoLayout, null, false, false)

                  mediaPlayer?.setEventListener { ev ->
                      when (ev.type) {
                          MediaPlayer.Event.Playing -> {
                              welcomeScreen.visibility = View.GONE
                              txtStatus.text = "Reproduciendo"
                              btnPlay.text = "❚❚"
                          }
                          MediaPlayer.Event.Paused -> {
                              txtStatus.text = "Pausa"
                              btnPlay.text = "▶"
                          }
                          MediaPlayer.Event.Stopped -> {
                              welcomeScreen.visibility = View.VISIBLE
                              txtStatus.text = "Detenido"
                              btnPlay.text = "▶"
                          }
                          MediaPlayer.Event.TimeChanged -> {
                              if (!isSeeking) {
                                  val t = ev.timeChanged
                                  val l = mediaPlayer?.length ?: 0L
                                  if (l > 0) {
                                      seekBar.progress = ((t.toFloat() / l) * 1000).toInt()
                                      txtTime.text = "${formatTime(t)} / ${formatTime(l)}"
                                  }
                              }
                          }
                          MediaPlayer.Event.EncounteredError -> {
                              txtStatus.text = "Error al abrir"
                              Toast.makeText(this, "Si no da imagen, pulsa [HW/SW]", Toast.LENGTH_LONG).show()
                          }
                      }
                  }
                  updateDecoderUi()
              }

              private fun rebuildPlayer() {
                  mediaPlayer?.stop()
                  mediaPlayer?.detachViews()
                  mediaPlayer?.release()
                  libVLC?.release()
                  initPlayer()
              }

              private fun play(uri: Uri, startPos: Long = 0L) {
                  currentUri = uri
                  try {
                      val pfd = contentResolver.openFileDescriptor(uri, "r")
                      if (pfd != null) {
                          val m = Media(libVLC, pfd.fileDescriptor)
                          m.addOption(":file-caching=2000")
                          if (!isHw) m.addOption(":avcodec-hw=none")
                          mediaPlayer?.media = m
                          m.release()
                          mediaPlayer?.play()
                          if (startPos > 0) {
                              handler.postDelayed({ mediaPlayer?.time = startPos }, 250)
                          }
                          welcomeScreen.visibility = View.GONE
                      }
                  } catch (e: Exception) {
                      Toast.makeText(this, "Error: ${e.message}", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun pickFile() {
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "video/*"
                  }
                  fileLauncher.launch(intent)
              }

              private fun cycleRotation() {
                  rotationMode = (rotationMode + 1) % 3
                  when (rotationMode) {
                      0 -> {
                          requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR
                          showOsd("Pantalla: Sensor Automático")
                      }
                      1 -> {
                          requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                          showOsd("Pantalla: Horizontal (Landscape)")
                      }
                      2 -> {
                          requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                          showOsd("Pantalla: Vertical (Portrait)")
                      }
                  }
                  videoLayout.post { videoLayout.requestLayout() }
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  videoLayout.post { videoLayout.requestLayout() }
              }

              private fun cycleAspect() {
                  aspectIndex = (aspectIndex + 1) % aspects.size
                  when (aspectIndex) {
                      0 -> mediaPlayer?.aspectRatio = null
                      1 -> mediaPlayer?.aspectRatio = "16:9"
                      2 -> mediaPlayer?.aspectRatio = "4:3"
                      3 -> mediaPlayer?.aspectRatio = "18:9"
                      4 -> mediaPlayer?.aspectRatio = "fill"
                  }
                  showOsd("Aspecto: ${aspects[aspectIndex]}")
              }

              private fun pickAudio() {
                  val tracks = mediaPlayer?.audioTracks ?: return
                  if (tracks.isEmpty()) return
                  val names = tracks.map { it.name }.toTypedArray()
                  val cur = mediaPlayer?.audioTrack ?: -1
                  val sel = tracks.indexOfFirst { it.id == cur }.coerceAtLeast(0)

                  AlertDialog.Builder(this)
                      .setTitle("Audio (MPC-HC)")
                      .setSingleChoiceItems(names, sel) { d, i ->
                          mediaPlayer?.audioTrack = tracks[i].id
                          showOsd("Audio: ${tracks[i].name}")
                          dialogClose(d)
                      }
                      .setNegativeButton("Cerrar", null).show()
              }

              private fun pickSubtitles() {
                  val tracks = mediaPlayer?.spuTracks ?: return
                  if (tracks.isEmpty()) return
                  val names = tracks.map { it.name }.toTypedArray()
                  val cur = mediaPlayer?.spuTrack ?: -1
                  val sel = tracks.indexOfFirst { it.id == cur }.coerceAtLeast(0)

                  AlertDialog.Builder(this)
                      .setTitle("Subtítulos (MPC-HC)")
                      .setSingleChoiceItems(names, sel) { d, i ->
                          mediaPlayer?.spuTrack = tracks[i].id
                          showOsd("Subtítulos: ${tracks[i].name}")
                          dialogClose(d)
                      }
                      .setNegativeButton("Cerrar", null).show()
              }

              private fun dialogClose(d: android.content.DialogInterface) {
                  d.dismiss()
              }

              private fun initGestures() {
                  gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                          isControlsVisible = !isControlsVisible
                          val v = if (isControlsVisible) View.VISIBLE else View.GONE
                          topBar.visibility = v
                          bottomBar.visibility = v
                          return true
                      }
                      override fun onDoubleTap(e: MotionEvent): Boolean {
                          mediaPlayer?.let { p -> if (p.isPlaying) p.pause() else p.play() }
                          return true
                      }
                  })

                  videoLayout.setOnTouchListener { _, ev ->
                      gestureDetector.onTouchEvent(ev)
                      true
                  }
              }

              private fun showOsd(msg: String) {
                  txtOsd.text = msg
                  txtOsd.visibility = View.VISIBLE
                  handler.removeCallbacks(osdRunnable)
                  handler.postDelayed(osdRunnable, 1600)
              }

              private val osdRunnable = Runnable { txtOsd.visibility = View.GONE }

              private fun updateDecoderUi() {
                  if (isHw) {
                      btnHwSw.text = "HW"
                      btnHwSw.setTextColor(0xFF2ECC71.toInt())
                      txtDecoderInfo.text = "[HW | 60 FPS]"
                  } else {
                      btnHwSw.text = "SW"
                      btnHwSw.setTextColor(0xFFE67E22.toInt())
                      txtDecoderInfo.text = "[SW | Hi10P Anime]"
                  }
              }

              private fun formatTime(ms: Long): String {
                  val s = (ms / 1000) % 60
                  val m = (ms / 60000) % 60
                  val h = ms / 3600000
                  return String.format(Locale.US, "%02d:%02d:%02d", h, m, s)
              }

              override fun onPause() {
                  super.onPause()
                  mediaPlayer?.pause()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  mediaPlayer?.release()
                  libVLC?.release()
              }
          }
          EOF

          # Generar Wrapper y Compilar APK
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

