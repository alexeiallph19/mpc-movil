              private val fileLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { res ->
                  val data = res.data
                  val selected = mutableListOf<Uri>()
                  if (res.resultCode == RESULT_OK && data != null) {
                      data.clipData?.let { clip -> for (i in 0 until clip.itemCount) selected.add(clip.getItemAt(i).uri) }
                      if (selected.isEmpty()) data.data?.let { selected.add(it) }
                  }
                  val shouldResume = resumeAfterFilePicker
                  filePickerPending = false
                  resumeAfterFilePicker = false
                  videoLayout.postDelayed({
                      restoreVideoOutput(selected.isEmpty() && shouldResume)
                      if (selected.isNotEmpty()) {
                          selected.forEach { persistReadPermission(it, data?.flags ?: 0) }
                          playlist.clear(); playlist.addAll(selected); playlistIndex = 0
                          showOsd("Lista: " + playlist.size + " archivos"); play(playlist[0])
                      }
                  }, 300)
              }
          
              private val subtitleLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { res ->
                  val uri = if (res.resultCode == RESULT_OK) res.data?.data else null
                  finishSubtitlePicker()
                  if (uri != null) {
                      persistReadPermission(uri, res.data?.flags ?: 0)
                      attachExternalSubtitle(uri)
                  }
              }
          
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  setContentView(R.layout.activity_main)
                  displayUnderNotch = getSharedPreferences("mpm_player", MODE_PRIVATE)
                      .getBoolean("display_under_notch", true)
                  applyDisplayUnderNotch()
                  enterImmersiveMode()
                  applyPreferredRefreshRate()
                  initViews()
                  initGestures()
                  initPlayer()
                  renderLibrary("Videos")
                  ensureLibraryPermission()
                  intent?.data?.let { play(it) }
              }
          

              private fun showAudioSubsPanel(initial: String) {
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(8), dp(16), dp(8)) }
                  val tabs = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val body = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  root.addView(tabs)
                  val trackScroll = ScrollView(this).apply {
                      isFillViewport = true
                      addView(body, android.widget.FrameLayout.LayoutParams(-1, -2))
                  }
                  root.addView(trackScroll, LinearLayout.LayoutParams(-1, dp(300)))
                  val dialog = AlertDialog.Builder(this).setTitle("Audio y subtítulos").setView(root)
                      .setNegativeButton("Cerrar", null).create()
                  var currentTab = if (initial == "Subs") "Subs" else "Audio"
                  var subtitleTrackSignature = ""
                  var lastRenderedTrackTab = ""
                  fun add(label: String, action: () -> Unit) {
                      body.addView(Button(this).apply {
                          text = label
                          isAllCaps = false
                          setOnClickListener { action() }
                      }, LinearLayout.LayoutParams(-1, dp(46)))
                  }
                  fun render(tab: String) {
                      currentTab = tab
                      if (tab == "Subs") {
                          val signature = mediaPlayer?.spuTracks.orEmpty()
                              .joinToString("|") { it.id.toString() + ":" + (it.name ?: "") } + "|selected=" + (mediaPlayer?.spuTrack ?: -1)
                          if (lastRenderedTrackTab == "Subs" && signature == subtitleTrackSignature) return
                          subtitleTrackSignature = signature
                      }
                      lastRenderedTrackTab = tab
                      body.removeAllViews()
                      if (tab == "Audio") {
                          val tracks = mediaPlayer?.audioTracks.orEmpty()
                          if (tracks.isEmpty()) add("No hay pistas de audio disponibles") {}
                          tracks.forEach { track ->
                              val prefix = if (track.id == (mediaPlayer?.audioTrack ?: -1)) "✓  " else ""
                              add(prefix + (track.name ?: ("Pista " + track.id))) {
                                  mediaPlayer?.audioTrack = track.id
                                  showOsd("Pista de audio cambiada")
                                  dialog.dismiss()
                              }
                          }
                      } else {
                          add("Desactivar subtítulos") {
                              mediaPlayer?.spuTrack = -1
                              showOsd("Subtítulos desactivados")
                              dialog.dismiss()
                          }
                          val tracks = mediaPlayer?.spuTracks.orEmpty()
                          tracks.forEach { track ->
                              val prefix = if (track.id == (mediaPlayer?.spuTrack ?: -1)) "✓  " else ""
                              add(prefix + (track.name ?: ("Subtítulo " + track.id))) {
                                  mediaPlayer?.spuTrack = track.id
                                  showOsd("Pista de subtítulos cambiada")
                                  dialog.dismiss()
                              }
                          }
                          add("Cargar subtítulo externo…") { dialog.dismiss(); pickExternalSubtitle() }
                      }
                  }
                  listOf("Audio", "Subs").forEach { tab ->
                      tabs.addView(Button(this).apply {
                          text = tab
                          isAllCaps = false
                          setOnClickListener { render(tab) }
                      }, LinearLayout.LayoutParams(0, dp(46), 1f))
                  }
                  render(currentTab)
                  dialog.show()
                  if (currentTab == "Subs") {
                      fun refreshSubtitleTracks(attempt: Int) {
                          handler.postDelayed({
                              if (dialog.isShowing && currentTab == "Subs" && attempt < 20) {
                                  render("Subs")
                                  refreshSubtitleTracks(attempt + 1)
                              }
                          }, 450)
                      }
                      refreshSubtitleTracks(0)
                  }
              }

              private fun showImagePanel() {
                  val items = arrayOf("Relación de aspecto", "Cambiar orientación", "Rellenar pantalla", "Alternar video bajo notch")
                  AlertDialog.Builder(this).setTitle("Imagen y pantalla").setItems(items) { _, which ->
                      when (which) {
                          0 -> showAspectMenu()
                          1 -> cycleRotation()
                          2 -> applyAspect(aspects.lastIndex)
                          3 -> {
