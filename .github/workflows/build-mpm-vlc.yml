name: Build MPM Player from VLC

on:
  workflow_dispatch:
  push:
    branches:
      - migracion-vlc-base
    paths:
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'application/**'
      - 'buildsystem/**'
      - '.github/workflows/build-mpm-vlc.yml'

permissions:
  contents: read

concurrency:
  group: mpm-vlc-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout MPM VLC base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint build-essential cmake gettext git libtool libtool-bin make pkg-config python3 unzip zip wget yasm nasm ant flex bison gperf

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Git identity for VLC patches
        run: |
          git config --global user.name "MPM Build Bot"
          git config --global user.email "mpm-build-bot@users.noreply.github.com"

      - name: Install Android SDK and NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Prepare VLC native sources and Gradle wrapper
        run: ./buildsystem/compile.sh --init

      - name: Restore MPM signing key
        env:
          MPM_KEYSTORE_BASE64: ${{ secrets.MPM_KEYSTORE_BASE64 }}
        run: |
          set +x
          test -n "$MPM_KEYSTORE_BASE64" || { echo "Missing MPM_KEYSTORE_BASE64 secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/mpm-signing"
          printf '%s' "$MPM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mpm-signing/mpm-player-release.jks"
          test -s "$RUNNER_TEMP/mpm-signing/mpm-player-release.jks"
          echo "MPM_KEYSTORE_FILE=$RUNNER_TEMP/mpm-signing/mpm-player-release.jks" >> "$GITHUB_ENV"

      - name: Build signed MPM Player APKs for all Android ABIs
        env:
          MPM_KEYSTORE_PASSWORD: ${{ secrets.MPM_KEYSTORE_PASSWORD }}
          MPM_KEY_ALIAS: ${{ secrets.MPM_KEY_ALIAS }}
          MPM_KEY_PASSWORD: ${{ secrets.MPM_KEY_PASSWORD }}
        run: |
          set +x
          test -n "$MPM_KEYSTORE_PASSWORD" || { echo "Missing MPM_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$MPM_KEY_ALIAS" || { echo "Missing MPM_KEY_ALIAS secret"; exit 1; }
          test -n "$MPM_KEY_PASSWORD" || { echo "Missing MPM_KEY_PASSWORD secret"; exit 1; }

          APK_DIR="application/app/build/outputs/apk/signedRelease"
          STAGING_DIR="$RUNNER_TEMP/mpm-apks"
          mkdir -p "$APK_DIR" "$STAGING_DIR"

          for entry in "arm64:arm64-v8a" "arm:armeabi-v7a" "x86:x86" "x86_64:x86_64"; do
            abi="${entry%%:*}"
            label="${entry#*:}"
            echo "::group::Building MPM Player for $label"
            rm -f "$APK_DIR"/*.apk
            ./buildsystem/compile.sh --signrelease -a "$abi" -t

            set -- "$APK_DIR"/*.apk
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "::error::Expected exactly one signed APK for $label"
              exit 1
            fi
            cp "$1" "$STAGING_DIR/MPM-Player-$label.apk"
            echo "::endgroup::"
          done

          (
            cd "$STAGING_DIR"
            zip -9 -j MPM-Player-4-ABIs.zip MPM-Player-arm64-v8a.apk MPM-Player-armeabi-v7a.apk MPM-Player-x86.apk MPM-Player-x86_64.apk
          )

      - name: Upload four signed APK variants
        uses: actions/upload-artifact@v4
        with:
          name: MPM-Player-4-ABIs
          path: ${{ runner.temp }}/mpm-apks/MPM-Player-4-ABIs.zip
          if-no-files-found: error
          retention-days: 14
