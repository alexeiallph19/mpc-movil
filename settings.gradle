pluginManagement {
    repositories {
        google()
        mavenCentral()
    }
}

include ':application:tools', ':application:resources', ':application:mediadb', ':application:live-plot-graph'
include ':application:vlc-android'

// Keep the upstream VLC checkout nested under third_party.
project(':application').projectDir = file('third_party/vlc-android/application')
project(':application:tools').projectDir = file('third_party/vlc-android/application/tools')
project(':application:resources').projectDir = file('third_party/vlc-android/application/resources')
project(':application:mediadb').projectDir = file('third_party/vlc-android/application/mediadb')
project(':application:live-plot-graph').projectDir = file('third_party/vlc-android/application/live-plot-graph')
project(':application:vlc-android').projectDir = file('third_party/vlc-android/application/vlc-android')
